                    - heading "Режим работы Эрмитажа 2025" [level=2] [ref=e320]
                    - list [ref=e321]:
                      - listitem [ref=e322]: "Среда, четверг, воскресенье: 11:00 – 18:00. Последний сеанс: 16:00."
                      - listitem [ref=e323]: "Вторник, пятница, суббота: 11:00 – 20:00. Последний сеанс: 18:00."
                    - paragraph [ref=e324]: Рекомендуем приходить в Эрмитаж заблаговременно. Предупреждаем, в выходные и праздничные дни, летом, в Новогодние и Рождественские праздники, День города и другие праздники в часы работы Эрмитажа может быть огромнейший наплыв посетителей.
                    - paragraph [ref=e325]: Поэтому в такие дни желательно приходить не во время работы Эрмитажа, а раньше - за полчаса до его открытия. Ведь можно простоять несколько часов в очереди, и даже не попасть в Музей.
                    - paragraph [ref=e326]:
                      - strong [ref=e327]: Посещение осуществляется по разработанным музеем маршрутам по сеансам
                      - text: ":"
                    - list [ref=e328]:
                      - listitem [ref=e329]: Маршрут № 1 по Главному музейному комплексу (вход с Иорданской лестницы). При выборе этого маршрута вам для посещения будут в первую очередь доступны Парадные залы Зимнего дворца, а также экспозиции Старого и Нового Эрмитажа. Этот маршрут следует выбрать, если вы хотите при посещении сделать упор на осмотр западноевропейского изобразительного искусства и картинной галереи Эрмитажа, а также познакомиться с античными коллекциями музея.
                      - listitem [ref=e330]: "Маршрут №2 по Главному музейному комплексу (вход с Церковной лестницы). При выборе этого маршрута для посещения будут в первую очередь доступны залы Зимнего дворца: дворцовые интерьеры и жилые покои императорской семьи, постоянные экспозиции русской культуры и стран Востока, а также английское и французское искусство. В залах, расположенных на третьем этаже Зимнего дворца, во всем своем многообразии представлено искусство Востока. Здесь можно познакомиться с археологическими памятниками, представленными на экспозиции «Культура и искусство Центральной Азии» – это около тысячи экспонатов из различных регионов Центральной Азии – Восточного Туркестана, Хара-Хото, Дуньхуана, Тибета и Монголии. В соседних залах представлено искусство Византии, Ближнего Востока и Османской империи. На третьем этаже Зимнего дворца можно посетить Галерею Отдела нумизматики. На экспозиции представлены памятники, рассказывающие об истории развития мирового денежного обращения с древних времен до нашего времени; разнообразные памятные и наградные медали, позволяющие проследить этапы развития отечественного медальерного искусства. Во второй части маршрута посетители смогут познакомиться с частью парадных залов Зимнего дворца (от Гербового зала) и с Картинной галереей и Античным искусством."
                    - paragraph [ref=e331]: Продолжительность одного сеанса посещения – 2 часа. Мы рекомендуем прибыть к входу в музей за 15 минут до начала сеанса. Проход на экспозиции должен быть осуществлен не позднее 30 минут после начала сеанса, после этого времени билет аннулируется и не подлежит возврату.
                    - heading "Стоимость билетов 2025" [level=2] [ref=e332]
                    - heading "Входной билет в Главный музейный комплекс" [level=3] [ref=e333]
                    - list [ref=e334]:
                      - listitem [ref=e335]:
                        - strong [ref=e336]: 500 рублей
                      - listitem [ref=e337]: Билет действителен на выбранный сеанс только в день посещения
                      - listitem [ref=e338]: Входной билет даёт возможность самостоятельного осмотра постоянных экспозиций и временных выставок
                    - heading "Входной билет по Специальному предложению" [level=3] [ref=e339]
                    - list [ref=e340]:
                      - listitem [ref=e341]:
                        - strong [ref=e342]: 300 рублей
                    - paragraph [ref=e343]:
                      - strong [ref=e344]: "Для отдельных категорий посетителей, имеющих право на льготу, при предъявлении соответствующих документов:"
                    - list [ref=e345]:
                      - listitem [ref=e346]: дети от 14 до 18 лет (независимо от гражданства)
                      - listitem [ref=e347]: многодетные семьи (граждане РФ и государств ЕАЭС)
                      - listitem [ref=e348]: студенты (независимо от гражданства) учебных заведений РФ
                      - listitem [ref=e349]: аспиранты, адъюнкты, интерны, врачи-ординаторы (независимо от гражданства) учебных заведений РФ
                    - heading "Входной билет по программе «Пушкинская карта»" [level=3] [ref=e350]
                    - list [ref=e351]:
                      - listitem [ref=e352]:
                        - strong [ref=e353]: 300 рублей
                      - listitem [ref=e354]: Для держателей Пушкинской карты доступны входные билеты в Главный музейный комплекс стоимостью – 300 рублей.
                      - listitem [ref=e355]: Количество билетов ограничено.
                      - listitem [ref=e356]: Вход для посетителей с билетами по программе «Пушкинская карта» осуществляется через Малый Эрмитаж (Шуваловский проезд, Миллионная, 37/Дворцовая наб., 36).
