                    - paragraph [ref=e416]: Билет можно оформить заранее на сайте или в день визита в кассе. Для прохода в музей необходимо иметь при себе документ, удостоверяющий личность, а также документ, подтверждающий принадлежность к льготной категории.
                    - heading "Бесплатное посещение в любой день работы музея для льготных категорий*" [level=4] [ref=e417]
                    - list [ref=e418]:
                      - listitem [ref=e419]: Льготные категории граждан могут посещать Главный музейный комплекс, Главный штаб и Музей императорского фарфорового завода бесплатно в любой день работы музея.
                      - listitem [ref=e420]: Бесплатные входные билеты можно оформить не только в кассе, но и заранее на сайте
                      - listitem [ref=e421]: Для прохода в музей посетителям кроме билета необходимо иметь при себе паспорт или другой документ, удостоверяющий личность, а также документ, подтверждающий принадлежность посетителя к льготной категории.
                      - listitem [ref=e422]: Контролёр входной зоны вправе запросить у посетителя эти документы.
                    - heading "Льготы и бесплатное посещение для пенсионеров" [level=3] [ref=e423]
                    - heading "Бесплатный день - каждый четверг" [level=4] [ref=e424]
                    - list [ref=e425]:
                      - listitem [ref=e426]: Пенсионеры (граждане Российской Федерации и государств ЕАЭС) могут посещать Главный музейный комплекс бесплатно каждый четверг.
                    - heading "Бесплатное посещение" [level=4] [ref=e427]
                    - list [ref=e428]:
                      - listitem [ref=e429]: Пенсионеры (граждане Российской Федерации и государств ЕАЭС) также имеют возможность бесплатного посещения Главного штаба и Музея Императорского фарфорового завода во все дни работы музеев.
                    - heading "Входной билет по Специальному предложению" [level=4] [ref=e430]
                    - list [ref=e431]:
                      - listitem [ref=e432]: Входной билет – 300 руб.
                      - listitem [ref=e433]: В Главный музейный комплекс для пенсионеров действует льготная цена на входные билеты – 300 рублей.
                    - heading "Условия" [level=4] [ref=e434]
                    - list [ref=e435]:
                      - listitem [ref=e436]: Пенсионеры, планирующие визит в Эрмитаж, могут оформить билеты на сайте tickets.hermitagemuseum.org.
                      - listitem [ref=e437]: Также билеты можно приобрести в кассах музея в день посещения.
                      - listitem [ref=e438]: Льготные билеты не предусматривают экскурсионного обслуживания.
                      - listitem [ref=e439]: При посещении музея на льготных условиях пенсионерам необходимо иметь при себе помимо билета документ, удостоверяющий личность, а также документ, подтверждающий принадлежность посетителя к льготной категории.
                    - heading "Бесплатное посещение для детей до 14 лет" [level=3] [ref=e440]
                    - paragraph [ref=e441]: "Дети, не достигшие возраста 14 лет (вне зависимости от гражданства), могут посетить следующие экспозиционные комплексы Эрмитажа по бесплатным входных билетам* в любой день работы музея:"
                    - list [ref=e442]:
                      - listitem [ref=e443]: Главный музейный комплекс;
                      - listitem [ref=e444]: Главный штаб;
                      - listitem [ref=e445]: Музей Императорского фарфорового завода.
                    - paragraph [ref=e446]: Бесплатные входные билеты для детей до 14 лет можно оформить не только в кассе перед посещением, но и заранее на сайте tickets.hermitagemuseum.org. При покупке билета на сайте взрослый посетитель к своему билету добавляет билет для ребёнка стоимостью 0 рублей.
                    - heading "Условия" [level=4] [ref=e447]
                    - list [ref=e448]:
                      - listitem [ref=e449]: Бесплатные входные билеты для детей до 14 лет можно оформить не только в кассе перед посещением, но и заранее на сайте tickets.hermitagemuseum.org. При покупке билета на сайте взрослый посетитель к своему билету добавляет билет для ребёнка стоимостью 0 рублей.
                      - listitem [ref=e450]: Обратите внимание, что дети до 12 лет могут посещать музей только в сопровождении взрослого, который приобрел электронный билет на сайте tickets.hermitagemuseum.org.
                      - listitem [ref=e451]: При оформлении бесплатных детских билетов в кассе кассир вправе попросить предъявить документы, содержащие сведения о возрасте ребёнка – свидетельство о рождении или паспорт (родителя или ребенка).
                      - listitem [ref=e452]: Входные билеты дают возможность осмотра экспозиции без экскурсии.
                      - listitem [ref=e453]: Обращаем ваше внимание, что для всех детей до 18 лет вне зависимости от возраста при посещении музея с экскурсией необходимо приобрести отдельный билет с экскурсионным обслуживанием для каждого ребенка за полную стоимость, либо по цене Специального предложения.
                    - heading "Бесплатное посещение для участников СВО и членов их семей" [level=3] [ref=e454]
                    - list [ref=e455]:
                      - listitem [ref=e456]: Участники специальной военной операции и ветераны боевых действий могут посетить Эрмитаж по бесплатным входным билетам в любой рабочий день музея.
                    - paragraph [ref=e457]:
                      - strong [ref=e458]: "С 5 сентября 2023 года право на бесплатное посещение Главного музейного комплекса, Главного штаба и Музея Императорского фарфорового завода получили члены семей участников СВО:"
                    - list [ref=e459]:
                      - listitem [ref=e460]: родители;
                      - listitem [ref=e461]: супруги;
                      - listitem [ref=e462]: несовершеннолетние дети;
                      - listitem [ref=e463]: дети старше 18 лет, ставшие инвалидами до совершеннолетия;
                      - listitem [ref=e464]: дети младше 23 лет — учащиеся очной формы образовательных учреждений РФ;
                      - listitem [ref=e465]: иждивенцы.
                    - paragraph [ref=e466]: "Оформить бесплатные входные билеты можно заранее на сайте tickets.hermitagemuseum.org либо в кассах музея в день посещения. Чтобы получить бесплатный входной билет, необходимо предоставить документ, подтверждающий участие члена семьи в СВО, а также документы, подтверждающие родство:"
                    - list [ref=e467]:
                      - listitem [ref=e468]: для супруга (супруги) — свидетельство о заключении брака;
                      - listitem [ref=e469]: для детей — свидетельство о рождении или об усыновлении (удочерении);
                      - listitem [ref=e470]: для родителей — свидетельство о рождении.
                    - paragraph [ref=e471]: При заказе электронного билета на официальном сайте Эрмитажа необходимо указать ФИО посетителя. Проверка документов, подтверждающих право на льготу, производится кассиром или контролёром во входной зоне музея.
                    - heading "Льготы и условия для держателей «Пушкинской карты»" [level=3] [ref=e472]
                    - list [ref=e473]:
                      - listitem [ref=e474]: Для держателей Пушкинской карты доступны входные билеты в Главный музейный комплекс стоимостью – 300 рублей. Количество билетов ограничено. Вход для посетителей с билетами по программе «Пушкинская карта» осуществляется через Малый Эрмитаж (Шуваловский проезд, Миллионная, 37/Дворцовая наб., 36)*.
                      - listitem [ref=e475]: Посетители с билетами по Пушкинской карте, планирующие визит в музей вместе с родственниками или друзьями, купившими билетами основной категории, могут вместе воспользоваться одним входом в музей – через Малый Эрмитаж (Шуваловский проезд, Миллионная, 37/Дворцовая наб., 36
                      - listitem [ref=e476]: Главный музейный комплекс Эрмитажа также можно посетить с обзорной экскурсией, купив билет по Пушкинской карте. После экскурсии посетители смогут продолжить самостоятельный осмотр экспозиций. Вход в музей на обзорную экскурсию осуществляется через Комендантский подъезд Зимнего дворца с Дворцовой площади.
                      - listitem [ref=e477]: По программе «Пушкинская карта» доступны билеты на экскурсии в Золотую и Бриллиантовую кладовые Галереи драгоценностей. Стоимость билета с экскурсионным обслуживанием – 1200 рублей. После окончания экскурсии можно самостоятельно познакомиться с экспозициями Главного музейного комплекса.
                      - listitem [ref=e478]: Билеты по программе «Пушкинская карта» являются именными. При оформлении заказа на сайте посетитель обязан указать фамилию, имя, отчество, а также необходимые сведения документа, удостоверяющего личность. Билеты можно приобрести на сайте tickets.hermitagemuseum.org и в кассе Малого Эрмитажа (Шуваловский проезд, Миллионная, 37/Дворцовая наб., 36). Обращаем внимание, что в кассе доступны только нереализованные на сайте билеты.
                      - listitem [ref=e479]: При проходе посетителей через турникеты контролер входной зоны вправе запросить у посетителя, предъявившего билет, документы, подтверждающие его личность, а также карту участника программы «Пушкинская карта» в электронном виде или на материальном носителе.
                      - listitem [ref=e480]: Условия для участия в программе «Пушкинская карта» – гражданство Российской Федерации, возраст от 14 до 22 лет включительно, наличие карты участника программы «Пушкинская карта».
                    - heading "Важно знать!" [level=3] [ref=e481]
                    - heading "Льготы не распространяются на экскурсионное обслуживание" [level=4] [ref=e482]
                    - list [ref=e483]:
                      - listitem [ref=e484]: Льготным категориям граждан, планирующим визит в Эрмитаж в третий четверг месяца, необходимо оформить бронирование заранее.
                      - listitem [ref=e485]: При формировании заказа на сайте покупатель заполняет реквизиты документа, дающего право на льготу. Полученный заказ-бронь посетитель до начала своего сеанса обменивает на входные билеты в кассах музея при предъявлении документов, указанных в заказе.
                      - listitem [ref=e486]: В случае, если льготный посетитель планирует визит в Эрмитаж с сопровождающим, например, ребенок с родителем или другим родственником, то сопровождающий должен приобрести в кассе музея в дополнение к льготному заказу – входной билет. Одного посетителя с льготным билетом может сопровождать только один человек, приобретающий билет в кассе.
                      - listitem [ref=e487]: Дети, не достигшие возраста 7 лет, вне зависимости от гражданства, смогут в любой день посетить музей бесплатно по маршрутам, которые не предполагают экскурсионного обслуживания. Дети до 7 лет могут посещать музей только в сопровождении взрослого, который приобрел электронный билет. Непосредственно перед началом сеанса в кассе музея сопровождающий получает на ребенка бесплатный входной билет. Кассир может попросить предъявить документы, содержащие сведения о возрасте ребёнка – свидетельство о рождении или паспорт.
                    - heading "Вход в музей" [level=4] [ref=e488]
                    - list [ref=e489]:
                      - listitem [ref=e490]: Вход в музей осуществляется по сеансам в связи с ограничениями допустимого количества посетителей, которые могут одновременно находиться в музее. Сеанс – это временной интервал, когда вы можете зайти в музей. Рекомендованная длительность посещения – 2 часа.
                      - listitem [ref=e491]: Система сеансов позволяет не допускать скопления людей во входной зоне, поэтому вход на территорию музея возможен не ранее чем за 30 минут до начала каждого сеанса. Посетителям рекомендовано прибыть к входу в музей за 15 минут до начала сеанса, на который был куплен билет. Проход на экспозиции должен быть осуществлен не позднее 30 минут после начала сеанса, после этого времени электронная система блокирует билет, который аннулируется и не подлежит возврату.
                      - listitem [ref=e492]: Количество посетителей каждого сеанса лимитировано для комфортного прохода через входную зону музея и осмотра экспозиций. Посетителям рекомендуется следовать заданному направлению движения во время прохода по экспозициям, в соответствии с указателями, что позволяет избежать встречных потоков людей и сделать пребывания в музее более удобным.
                      - listitem [ref=e493]: Использование средств индивидуальной защиты в музее носит рекомендательный характер.
                    - heading "Билеты" [level=4] [ref=e494]
                    - list [ref=e495]:
                      - listitem [ref=e496]: Билеты во все экспозиционные комплексы Государственного Эрмитажа можно приобрести на сайте tickets.hermitagemuseum.org
                      - listitem [ref=e497]: В день посещения билеты также можно приобрести в кассах музея при наличии доступных билетов на текущий день.
                      - listitem [ref=e498]: Электронный билет действителен на выбранный сеанс и маршрут только в день посещения.
                      - listitem [ref=e499]:
                        - text: "Купить билеты онлайн на официальном сайте Эрмитажа:"
                        - link "hermitagemuseum.org" [ref=e500] [cursor=pointer]:
                          - /url: https://tickets.hermitagemuseum.org
                        - text: .
                    - heading "Как добраться до Эрмитажа" [level=2] [ref=e501]
                    - list [ref=e502]:
                      - listitem [ref=e503]: "Адрес: Санкт-Петербург, Дворцовая площадь, 2"
                      - listitem [ref=e504]: "Ближайшие станции метро: \"Адмиралтейская\" (700 м), \"Невский проспект\" (900 м), \"Гостиный Двор\" (1,3 км)"
                      - listitem [ref=e505]: "Автобусы: 7, 10, 24, 191"
                      - listitem [ref=e506]: "Троллейбусы: 1, 7, 10, 11"
                    - paragraph [ref=e507]: До Главного музейного комплекса Эрмитажа, который находится на Дворцовой площади, можно доехать на метро. Ближайшая станция метро — "Адмиралтейская", от неё до Эрмитажа — 700 м. При выходе из станции нужно добраться до улицы Малой Морской, зетам повернуть направо, пройти несколько метров до Невского проспекта. Далее потребуется прогуляться по главной и самой красивой магистрали города — Невскому проспекту, чтобы вскоре оказаться на Дворцовой площади и у входа в Эрмитаж.
                    - paragraph [ref=e508]: Также можно добираться до Эрмитажа от станции метро "Невский проспект", которая удалена от его Главного комплекса на 900 м. От станции метро "Гостиный Двор" Эрмитаж находится в 1,3 км. В обоих случаях нужно выйти на Невский проспект, следовать в сторону Адмиралтейства до Большой Морской улицы. На пересечении Большой Морской улицы с Невским проспектом будет видна арка Главного штаба. Пройдя под ней, попадаете на Дворцовую площадь. Вход в Главный музейный комплекс с Дворцовой площади.
                    - paragraph [ref=e509]: Можно добраться до Эрмитажа наземным транспортом. Автобусы №№ 7, 10, 24, 191, а также троллейбусы №№ 1, 7, 10, 11 идут до Дворцовой площади. Нужно доехать до одноимённой остановки, от которой до Эрмитажа необходимо пройти всего 300 м.
                    - heading "Официальный сайт и телефоны" [level=2] [ref=e510]
                    - list [ref=e512]:
                      - listitem [ref=e513]:
                        - strong [ref=e514]:
                          - link "hermitagemuseum.org" [ref=e515] [cursor=pointer]:
                            - /url: https://www.hermitagemuseum.org/wps/portal/hermitage/about/contacts?lng=ru
                      - listitem [ref=e516]: "Администратор входной зоны: +7 (812) 710-90-79"
                      - listitem [ref=e517]: "Круглосуточная справка автоответчик: +7 (812) 710-96-25"
                      - listitem [ref=e518]: "Экскурсионное бюро Эрмитажа: +7 (812) 571-84-46"
                    - heading "История создания Эрмитажа" [level=2] [ref=e519]
                    - paragraph [ref=e520]: Государственный Эрмитаж – это старейший и знаменитейший музей зарубежного искусства в России. По своей значимости он стоит на одной ступени с известнейшими музеями мира, такими как Лувр, Метрополитен, Британский музей. В состав музейного комплекса «Эрмитаж» входят 5 зданий, самым известным из которых является Зимний дворец на Дворцовой площади. Также в него входят Малый Эрмитаж, Большой Эрмитаж, Эрмитажный театр и Новый Эрмитаж.
                    - paragraph [ref=e521]: Название музея произошло от французского слова "ermitage", и в буквальном переводе означает «жилище отшельника» или «уединенный уголок». Это связано с местом, где находились картины из первой коллекции, которые купила Екатерина ІІ. Эти картины располагались в здании прилегающем к Зимнему дворцу. Сейчас оно называется Малый Эрмитаж.
                    - paragraph [ref=e522]:
                      - img "Зимний дворец и Дворцовая площадь - Санкт-Петербург" [ref=e523]
                    - paragraph [ref=e524]: "Малый Эрмитаж – это два павильона с двумя галереями, окружающими Висячий сад, находившийся на крыше первого этажа. Павильоны были построены по заказу императрицы: северный (Оранжерейный дом) построен французом Ж.Б. Валленом-Деламотом (1767-1769), а южный павильон с галереями был построен под руководством русского архитектора Ю. Фельтена (1764-1775)."
                    - paragraph [ref=e525]: В северном павильоне была создана уникальная, по тем временам, конструкция с подъемными столами. С помощью механизмов, уже сервированные и накрытые столы подымались на второй этаж. Обед проходил без слуг. Гости в эту комнату приглашались самой Екатериной. Из-за размеров комнаты в ней могло находиться не более 15 человек.
                    - paragraph [ref=e526]: Сбор коллекций берет свое начало с 1764 г., когда «в уплату долга» Екатерине ІІ было отдано 225 картин немецким купцом Гоцковским. Их разместили в Малом Эрмитаже. Императрицей был отдан наказ скупать произведения искусства на аукционах.
                    - paragraph [ref=e527]: В пополнении коллекции сыграл не последнюю роль Русский посол во Франции Д.А.Голицын. Благодаря его дружбе с Дидро и другими представителями французской культуры, в Эрмитаже появились работы Рембрандта, Рубенса, Джорджоне и многих других известных художников. Коллекцию произведений пополняли не только картинами. Гравюры, рисунки, античные ценности, драгоценные резные камеи, книги, - все это становилось экспонатом музея.
                    - paragraph [ref=e528]:
                      - img "Санкт-Петербург. Старые фото" [ref=e529]
                    - paragraph [ref=e530]: Павильоны и галереи заполнялись произведениями искусства достаточно быстро, поэтому вскоре возникла необходимость в постройке нового здания. Оно было построено на берегу Невы Ю.Фельтеном (1771-1787). Из-за его размеров его назвали Большой Эрмитаж, а со временем – Старый Эрмитаж. Крытый мостик соединял Большой Эрмитаж с театром.
                    - paragraph [ref=e531]: Позднее, вдоль Зимней канавки, было создано повторение ватиканских лоджий Рафаэля по проекту архитектора Дж.Кваренги (1783–1787). Они располагались в особом корпусе, примыкающем к зданию Старого Эрмитажа под прямым углом. Копия росписией Рафаэля были написаны в Риме под руководством Х. Унтербергера.
                    - paragraph [ref=e532]: К концу правления императрицы Екатерины ІІ, было собрано около четырех тысяч картин. Ими было заполнены здания Малого и Старого Эрмитажа, лоджии Рафаэля и фойе театра. С тех пор за этим комплексом зданий закрепилось общее название – Эрмитаж.
                    - paragraph [ref=e533]: Продолжил собирать коллекцию Александр І. Им были приобретены картины Рембрандта и Рубенса, Поттера и Клода Лоррена, статуи Кановы.
                    - paragraph [ref=e534]: Доступ в Эрмитаж был дан узкому кругу людей до середины 19 в. Билеты на право входа выдавались царской конторой и были доступны узкому кругу людей.
                    - paragraph [ref=e535]:
                      - img "Редкие фото Санкт-Петербурга начала XX века" [ref=e536]
                    - paragraph [ref=e537]: Благодаря возникновению общедоступных музеев в Европе, в Санкт-Петербурге тоже был построен один из таких музеев. Он примыкал к строениям Малого и Старого Эрмитажа и был назван Новый Эрмитаж.
                    - paragraph [ref=e538]: Новый Эрмитаж строился как музей для посещения широкой публики, и выполнял просветительские функции.
                    - paragraph [ref=e539]: Впервые в музее были спроектированы специальные выставочные помещения для конкретных коллекций, систематизированных по научным принципам. Освобождая старые помещения от экспонатов, в Новый Эрмитаж были перенесены лучшие из царских коллекций.
                    - paragraph [ref=e540]: Известный на весь мир архитектор Лео фон Кленце спроектировал здание с учетом опыта строительства музеев Европы в 19 в. Помещения первого этажа были построены в стиле греко-римской архитектуры – пять залов занимали античные коллекции, залы со скульптурами и «музеум книги», залы с гравюрами и рисунками.
                    - paragraph [ref=e541]:
                      - img "Эрмитаж. Старые фото" [ref=e542]
                    - paragraph [ref=e543]: На втором этаже были спроектированы картинные залы, залы для монет, медалей, камей. Каждой национальной школе отводился отдельный зал.
                    - paragraph [ref=e544]: Музеем для общественных посещений был только Новый Эрмитаж. Зимний дворец, Малый и Старый Эрмитаж, театр оставались царской резиденцией.
                    - paragraph [ref=e545]: В первой половине 19 в. покупки продолжались, но уже в меньшем масштабе. В этот период времени сформировалась испанская коллекция, которой практически не было при Екатерине ІІ.
                    - paragraph [ref=e546]: В отличии от покупок императрицы, а это была в основном живопись, было куплено больше скульптур и ваз. Изюминкой приобретений стала римская коллекция маркиза Кампана, что поставило античное собрание Эрмитажа на одну ступень с известнейшими коллекциями Европы.
                    - paragraph [ref=e547]:
                      - img "Санкт-Петербург. Старые фото" [ref=e548]
                    - paragraph [ref=e549]: После революции часть коллекции Эрмитажа была перевезена в Москву и оставалась там до 1922 года. Путем национализирования произведений искусств Эрмитаж пополнялся картинами французских живописцев середины 19 в. В советское время до начала 1930-х годов коллекция Эрмитажа увеличилась в четыре раза.
                    - paragraph [ref=e550]: "Для размещения своих коллекций музею были переданы бывшие царские резиденции: Зимний дворец, Малый Эрмитаж, Старый Эрмитаж, театр и лоджии Рафаэля."
                    - paragraph [ref=e551]: Из-за опасения разрушений во время второй мировой войны, коллекции Эрмитажа были эвакуированы в Свердловск, но уже в 1945 году были возвращены и 8 ноября были открыты для посетителей.
                    - paragraph [ref=e552]: В наши дни Эрмитажу были переданы новые помещения. Среди них Меншиковский дворец и Петровский Зимний дворец. Для временных выставок было отреставрировано и отдано одно крыло здания Главного штаба на дворцовой площади. Сооружались и другие помещения для показа временных коллекций, однако и этого тоже не хватает для демонстрации всех достояний музея.
                    - paragraph [ref=e553]: Эрмитаж интересен не только выставочными экспонатами, а и интерьером, который создавался лучшими архитекторами России и Европы. На сегодняшний день, это один из наиболее значимых музеев мира. Число его посетителей и его популярность растёт с каждым днем.
                    - paragraph [ref=e554]:
                      - img "Петроград. Старые фото" [ref=e555]
                    - paragraph [ref=e556]
                    - paragraph [ref=e557]: Датой основания Эрмитажа считается 1764 год, когда императрица Екатерина II приобрела коллекцию произведений живописи у Иоганна Эрнста Гоцковского — прусского купца, торговавшего шёлком, тафтой, фарфором, зерном и векселями.
                    - paragraph [ref=e558]:
                      - 'img "Иоганн Эрнст Гоцковский. Автор: Frederik Christian Carstens" [ref=e559]'
                    - paragraph [ref=e560]: А главное, Гоцковский был крупным коллекционером и торговцем произведениями искусства. Приобретение в частном порядке Екатериной II в 1764 году картинной галереи Гоцковского положило начало Эрмитажу в Санкт-Петербурге. День своего основания музей ежегодно празднует 7 декабря – в День святой Екатерины.
                    - paragraph [ref=e561]:
                      - img "Виргилиус Эриксен \"Портрет Екатерины II перед зеркалом\", 1762 — 1764 гг." [ref=e562]
                    - paragraph [ref=e563]: В частном собрании Екатерины II были полотна таких мастеров, как Дирк ван Бабюрен, Хендрик ван Бален, Рембрандт ван Рейн, Питер Пауль Рубенс, Якоб Йорданс, Антонис ван Дейк, Хендрик Гольциус, Франс Хальс, Ян Стен, Геррит ван Хонтхорст и другие произведения, в основном голландско-фламандской школы первой половины XVII века.
                    - paragraph [ref=e564]: Именно эти произведения стали основой, на которой создавался музей Эрмитаж. Поначалу большая часть полотен была размещены в уединённых апартаментах дворца, сейчас – это в Малом Эрмитаже. В будущем апартаменты получили название "Эрмитаж" - "место уединения и тишины".
                    - paragraph [ref=e565]:
                      - img "Ян Стен, \"Гуляки\", 1660 г. Из коллекции Гоцковского" [ref=e566]
                    - paragraph [ref=e567]: До середины XIX века Эрмитаж полностью соответствовал своему названию, поскольку посещать музей могли лишь избранные. Так, А. С. Пушкин смог получить пропуск только благодаря рекомендации В. А. Жуковского, служившего наставником у сына императора.
                    - paragraph [ref=e568]:
                      - img "Якоб Йорданс, \"Аллегорический семейный портрет\", начало 1650-х гг. Из коллекции Гоцковского" [ref=e569]
                    - paragraph [ref=e570]: Эрмитаж был открыт для публики 17 февраля 1852 года при императоре Николае I в специально построенном для этой цели здании Нового Эрмитажа. Тогда он насчитывал богатейшие коллекции памятников древневосточной, древнеегипетской, античной и средневековой культур, искусства Западной и Восточной Европы, археологических и художественных памятников Азии, русской культуры VIII—XIX веков. К 1880 году посещаемость музея достигла 50 000 человек в год.
                    - paragraph [ref=e571]:
                      - img "Неизвестный художник, по рисунку М. И. Махаева. Вид Зимнего дворца. 1750-е гг." [ref=e572]
                    - heading "Коллекции и произведения" [level=3] [ref=e573]
                    - paragraph [ref=e574]: Из тех 317 картин, приобретённых императрицей Екатериной Великой и переданных в Россию в 1764 году, до наших дней сохранились по меньшей мере 96 картин. Но сегодня Государственный Эрмитаж обладает коллекцией, которая насчитывает около 3-х миллионов произведений искусства и памятников мировой культуры.
                    - paragraph [ref=e575]: Экспозиция музея отображает развитие мирового искусства с каменного века до конца XX столетия. Огромное значение имеет собрание первобытного искусства и археологических культур с территории бывшего СССР, особенно богатейшая в мире коллекция так называемого скифского золота, уникальные находки из курганов Пазырыка, памятники других культур Великой Степи. Представлены так называемые «палеолитические Венеры» из села Костёнки, многочисленные образцы керамики, бронзовое литьё, каменные плиты с петроглифами.
                    - paragraph [ref=e576]: "Картинная галерея \"старых мастером\" отражает академические вкусы собирателей — российских императоров. Среди жемчужин собрания старой европейской живописи: татищевский диптих Робера Кампена, \"Мадонна Бенуа\" Леонардо да Винчи, \"Юдифь\" Джорджоне, \"Женский портрет\" Корреджо, \"Святой Себастьян\" Тициана, \"Лютнист\" Караваджо, \"Возвращение блудного сына\" Рембрандта, \"Дама в голубом\" Гейнсборо. Музей обладает богатыми собраниями картин Рубенса, Рембрандта, Ван Дейка, Пуссена, Тициана, Веронезе, Клода Лоррена и других."
                    - paragraph [ref=e577]:
                      - img "\"Донна Нуда\" — одна из дюжины леонардесков, которые в XVIII—XIX вв. приобретались для Эрмитажа как произведения Леонардо да Винчи" [ref=e578]
                    - paragraph [ref=e579]: В состав собрания Эрмитажа входят – живопись, графика, скульптура и предметы прикладного искусства, археологические находки и нумизматический материал. Сейчас экспонаты огромного музейного пространства показывают развитие мирового искусства с каменного века до конца XX столетия.
                    - paragraph [ref=e580]: "Залы Эрмитажа уникальны и разнообразны: Культура и искусство первобытного общества; Культура и искусство античного мира; Живопись; Итальянская живопись XIII—XVIII веков; Старонидерландская живопись XV—XVI веков; Испанская живопись XV — начала XVIII века; Фламандская живопись XVII—XVIII веков; Голландская живопись XVII—XVIII веков; Английская живопись XVI—XIX веков; Французская живопись XV—XVIII веков; Французская живопись XIX—XX веков; Нумизматика."
                    - paragraph [ref=e581]:
                      - img "Смерть короля Кандавла (итал. La morte di re Candaule), 1757, ди Джамбаттиста Питтони" [ref=e582]
                    - paragraph [ref=e583]: В собрании первобытного искусства и археологических культур территории бывшего СССР представлены так называемые "палеолитические Венеры" из села Костенки, многочисленные образцы керамики, бронзовое литье, каменные плиты с петроглифами.
                    - paragraph [ref=e584]: Коллекция античных древностей в Эрмитаже насчитывает свыше 106 000 памятников, в ней представлены культура и искусство Древней Греции, Древней Италии и Рима, античных колоний Северного Причерноморья. Обширная экспозиция античных древностей находится в залах первого этажа Нового Эрмитажа.
                    - paragraph [ref=e585]: Богато собрание греческих и италийских расписных ваз (15 000 экземпляров), памятников культуры Этрурии. Коллекция античных гемм — инталий и камей — включает около 10 000 памятников. Достаточно полно в Эрмитаже представлены все основные виды римской скульптуры.
                    - paragraph [ref=e586]: "Также в музее экспонируются: коллекция танагрских терракотовых статуэток, материалы раскопок греческих городов и некрополей Северного Причерноморья, греческие золотые изделия, греческие ткани, деревянные античные саркофаги и другие изделия из дерева."
                    - paragraph [ref=e587]:
                      - img "Скифский золотой гребень (исп.) из кургана Солоха начало IV века до н. э. (возможно, изготовлен на заказ древними греками" [ref=e588]
                    - heading "Картинные галереи" [level=3] [ref=e589]
                    - paragraph [ref=e590]: Огромный интерес и художественную ценность Эрмитажа представляют его коллекции картин. Не зря музей называют храмом искусства. По его залам можно ходить немеряное количество времени и, все равно, за много лет всего не осмотреть. Но есть здесь истинные жемчужины, требующие созерцания в первую очередь, — признанные мировые шедевры великих мастеров всех времён и народов.
                    - paragraph [ref=e591]: "В залах второго этажа Большого Эрмитажа представлены работы мастеров эпохи Возрождения: Леонардо да Винчи, Рафаэля, Джорджоне, Тициана. Сейчас в мире осталось 14 картин, написанных непревзойденным мастером Леонардо да Винчи."
                    - paragraph [ref=e592]: "В Эрмитаже выставлены две его Мадонны: \"Мадонна Бенуа\" и \"Мадонна Литта\". Вторая из них считается самым лиричным изображением Богоматери, которое когда-либо изображали на холсте. Мастеру удалось передать женскую нежность, материнскую любовь, которую любящая мать испытывает к своему малышу. В 1864 году полотно было куплено у владельца Миланской картиной галереи графа Литта. Это сокровище Эрмитажа."
                    - paragraph [ref=e593]:
                      - img "Леонардо да Винчи \"Мадонна Бенуа\", между 1478 - 1480 гг." [ref=e594]
                    - paragraph [ref=e595]: Творчество Тициана представлено в Эрмитаже 8 произведениями, среди них "Кающаяся Мария Магдалина". Первую версию картины художник написал по заказу в 1560 году, но она произвела такое впечатление на современников, что Тициану пришлось написать еще три варианта, в каждом из которых менялся задний план, положение рук и головы героини.
                    - paragraph [ref=e596]: Хранящийся в Эрмитаже вариант считается наиболее совершенным. На полотне изображена земная женщина, на чью долю выпало немало душеных мук. Ее глаза полны слез, а взгляд полон раскаяния.
                    - paragraph [ref=e597]:
                      - img "Кающаяся Мария Магдалина (картина Тициана, около 1565)" [ref=e598]
                    - paragraph [ref=e599]: В 1850 году Николай Первый приобрёл её и ещё несколько картин для музейной коллекции. В 1792 году по заказу императрицы Екатерины II архитектор Джакомо Кваренги в здании Большого Эрмитажа создаёт галерею с копиями рафаэлевских фресок — знаменитые "Лоджии Рафаэля".
                    - paragraph [ref=e600]: Собрание старонидерландской живописи насчитывает около 100 картин. Среди них несколько шедевров мирового значения, таких как татищевский диптих Робера Кампена "Троица. Мадонна с младенцем у камина" (приписывался Ван Эйку); один из 3-х авторских вариантов картины Рогира ван дер Вейдена "Святой Лука, рисующий мадонну"; позднее произведение Лукаса ван Лейдена "Исцеление иерихонского слепца"; 2 групповых портрета кисти Дирка Якобса.
                    - paragraph [ref=e601]:
                      - img "Створка диптиха Робера Кампена, поступившего в Эрмитаж из татищевского собрания (приписывался Ван Эйку)" [ref=e602]
                    - paragraph [ref=e603]: Эрмитажная коллекция испанской живописи XV — начала XVIII века насчитывает более 160 полотен и является самой многочисленной за пределами Испании. Здесь представлена самая знаменитая из картин Эль Греко - "Апостолы Петр и Павел".
                    - paragraph [ref=e604]: Это полотно, написанное в 1592 году, по разным причинам было предано забвению почти три столетия. Она наполнена тайным смыслом и загадочными символами, о которых спорят специалисты. Портрет был выполнен в столь тонкой технике, что даже с помощью рентгенографа трудно найти однозначные ответы. Одно бесспорно, образу апостола Павла художник придал собственные черты.
                    - paragraph [ref=e605]:
                      - img "El Greco - Апостолы Петр и Павел" [ref=e606]
                    - paragraph [ref=e607]: "Мадридская живопись середины и второй половины XVII века представлена работами художников: Франсиско Кольянтес, Антонио де Пуга, Антонио Переда, Хосе Антолинес, Матео Сересо."
                    - paragraph [ref=e608]: Коллекция фламандской живописи в Эрмитаже насчитывает свыше 500 картин, выполненных более чем 140 художниками. Полотна ведущих живописцев Фландрии, таких как Питер Пауль Рубенс, Антонис Ван Дейк, Якоб Йорданс, Франс Снейдерс, экспонируются в здании Нового Эрмитажа.
                    - paragraph [ref=e609]: Собрание работ Рубенса включает 22 картины и 19 эскизов. Среди наиболее известных полотен — "Союз Земли и Воды", "Персей и Андромеда", "Возчики камней", "Вакх". Ученик Рубенса Ван Дейк представлен 24 произведениями.
                    - paragraph [ref=e610]:
                      - img "Сенека. 1600—1602, чёрный мелок. 46 × 32 см." [ref=e611]
                    - paragraph [ref=e612]: В Эрмитаже коллекция голландской живописи насчитывает свыше 1000 картин и занимает одно из первых мест в мире по количеству шедевров и имён, в том числе и самых редких. Картины голландских художников занимают 6 залов Нового Эрмитажа.
                    - paragraph [ref=e613]: В них представлены произведения таких художников, как Ян ван Гойен, Якоб ван Рёйсдал, Ян Стен, Герард Терборх, Габриель Метсю, Питер де Хох, Адриан и Исаак ван Остаде, Паулюс Поттер, Виллем Клас Хеда, Виллем Калф.
                    - paragraph [ref=e614]:
                      - img "Ян ван Гойен, \"Пейзаж с дубом\", Голландия, 1634 гг." [ref=e615]
                    - paragraph [ref=e616]: Искусству Рембрандта Харменсу ван Рейну посвящён целый зал. Каждое из полотен, представленных на всеобщее обозрение, привлекает и завораживает. В числе самых знаменитых шедевров значится "Даная". Сюжет этой картины – явление Зевса в виде струй золотого дождя к девушке, заточенной в подземелье. Его можно увидеть в творчестве многих художников, в том числе и Тициана.
                    - paragraph [ref=e617]: Холст на протяжении длительного времени приводил в замешательство искусствоведов, потому что на нем ярко прослеживались два стиля исполнения. Лишь когда в распоряжении экспертов оказался рентгенограф, стало все ясно.
                    - paragraph [ref=e618]: Изначально мастер изобразил свою жену — Саскию, которая позировала ему для многих работ. Рядом с героиней находился смеющийся ангел, и на нее проливался золотой дождь. Но после смерти супруги, Рембрандт изменил лицо девушки на портрете, придав ему черты своей новой спутницы.
                    - paragraph [ref=e619]:
                      - img "Рембрандт. \"Даная\", 1636—1647 гг." [ref=e620]
                    - paragraph [ref=e621]: Видимо скорбь художника по почившей супруге была очень сильна. На полотне появилась старуха служанка, а выражение лица ангела стало страдальческим. Несмотря на то, что Даная не вписывается в современные каноны красоты, она считается воплощением женственности и чувственности.
                    - paragraph [ref=e622]: Ужасная история случилось в прошлом веке с "Данаей". Субботним июньским днем 1985 года мужчина из экскурсионной группы узнал от гида, что "Даная" является одной из самых ценных картин Эрмитажа. Недолго думая, он облил полотно серной кислотой и дважды ударил по нему ножом. Казалось, что бесценный шедевр был утрачен навсегда, ведь было практически разрушено около 30% картины.
                    - paragraph [ref=e623]: Но благодаря кропотливому труду реставраторов, ее удалось восстановить. На это ушло 12 лет. Сейчас картина снова выставлена в экспозиции и радует посетителей, но она огорожена бронированным стеклом.
                    - paragraph [ref=e624]: "Еще один шедевр Рембрандта, мимо которого невозможно пройти – это \"Возвращение блудного сына\". Это одна из последних работ художника. Он трудился над её созданием почти 30 лет. Известный библейский сюжет на полотне вызывает множество споров среди искусствоведов, один из которых касается вопроса: кто и что является фоном картины. Некоторые исследователи считают, что едва уловимые в темноте фигуры – сам блудный сын до того, как он покинул отчий дом, и после его возвращения. Но эта версия не единственная."
                    - paragraph [ref=e625]:
                      - img "Рембрандт \"Возвращение блудного сына\"" [ref=e626]
                    - paragraph [ref=e627]: "Коллекция английской живописи XVI—XIX веков в Эрмитаже — небольшая, всего около 450 полотен. Её представляют художники XVII века: Уильям Добсон, Готфрид Кнеллер, Джон Вуттон. Английские живописцы XVIII столетия представлены такими именами, как Джошуа Рейнолдс;; Бенджамин Уэст; Томас Гейнсборо; Джордж Ромни; Джордж Морленд; Джозеф Райт. Художники XIX века: Ричард Паркс Бонингтон; Томас Лоуренс."
                    - paragraph [ref=e628]: В Эрмитаже хранится свыше 300 изображений генералов русской армии и три больших портрета в рост фельдмаршалов М. И. Кутузова, Барклая де Толли, А. Веллингтона, выполненные для Военной галереи 1812 года Зимнего дворца Джорджем Доу.
                    - paragraph [ref=e629]:
                      - 'img "Военная галерея в Зимнем дворце. Фото: M3peti (hu.wikipedia)" [ref=e630]'
                    - paragraph [ref=e631]: "Собрание французской живописи XVIII века насчитывает более 400 произведений. Представлены художники: Антуан Ватто, Франсуа Буше, Жан Батист Грёз, Жан Батист Симеон Шарден, Жан Оноре Фрагонар, Юбер Робер."
                    - paragraph [ref=e632]: "Французскую живопись представляют около 850 работ. Художники рубежа XVIII—XIX столетий: Г. Летьер, Р. Лефевр, А. Карафф, К. Верно, А. Жироде, П. Шовен, П. Герен, Ф. Жерар и др. Собрание французской живописи рубежа XIX — XX веков, насчитывающее около 250 полотен: Клод Моне, Огюст Ренуар, Камиль Писсаро, Альфред Сислей, Эдгар Дега."
                    - paragraph [ref=e633]: Важное место в этой коллекции занимают работы Клода Моне. Его произведение "Дама в саду Сент-Андресс" стала обложкой каталога работ этого художника, собранных по всему миру. Удивительным фактом всегда останется для потомков — умение художника тончайшим образом предавать светоцветовую игру.
                    - paragraph [ref=e634]:
                      - img "Клод Моне \"Дама в саду Сент-Андресс\", 1867 г." [ref=e635]
                    - paragraph [ref=e636]: Еще один шедевр – "Мост Ватерлоо. Эффект тумана". Сюжет полотна открывается на расстоянии. Вблизи все тонет в одном фиолетовом фоне. Лишь с двухметровой дистанции через плотный туман просачиваются загадочные очертания каменного моста, по телу могут пробежать мурашки от ощущения свежести и движения воды.
                    - paragraph [ref=e637]: В Эрмитаже выставлено несколько полотен, принадлежащих кисти Ренуара. Одна из них — "Портрет актрисы Жанны Самари". Произведение наполнено светом, лучезарные оттенки и переходы вызывают неподдельное восхищение. Однако история шедевра драматична. Едва написанная картина чуть не была потеряна.
                    - paragraph [ref=e638]:
                      - img "Огюст Ренуар \"Портрет актрисы Жанны Самари\", 1877 г." [ref=e639]
                    - paragraph [ref=e640]: Ренуар писал её для выставки, и, зная, что краски не просохли, не стал покрывать лаком. Но служащий галереи, перевозивший картину решил, что у художника просто не хватило средств, и самовольно покрыл её лаком. Краски потекли. Картину невозможно было восстановить. Художнику пришлось снова браться за кисти и повторить свое гениальное творение.
                    - paragraph [ref=e641]: Постимпрессионизм представлен в Эрмитаже такими мастерами, как Поль Сезанн, Поль Гоген, Винсент Ван Гог. Символизм представлен картинами Э. Каррьера, П. Пюви де Шаванна, О. Редона. Произведения П. Синьяка, А. Фантен-Латура, А. Руссо, художников группы Наби — М. Дени, П. Боннара, Ф. Валлотона, Ж. Э. Вюйара, К. Русселя наряду с работами А. Марке, А. Дерена, К. Ван Донгена, М. Вламинка, А. Мангена, Ж. Руо создают почти исчерпывающую картину развития французской живописи этого времени.
                    - paragraph [ref=e642]:
                      - img "Поль Сезанн \"Натюрморт с драпировкой\", 1895 г." [ref=e643]
                    - paragraph [ref=e644]: Особую ценность собранию придают 37 работ Анри Матисса. Эрмитаж обладает большой коллекцией произведений Матисса. Они попали сюда из частного собрания коллекционера Сергея Щукина. Он скупал картины непопулярных тогда художников, спасая первых от сожжения, а последних от голодной смерти. Щукина называли "собирателем хлама" и "несведущим в искусстве человеком". После революции коллекция была национализирована и передана в Эрмитаж.
                    - paragraph [ref=e645]: Время всё расставило по своим местам. Жаль, что сегодня нет в живых в тех, кто столь нелестно отзывался об истинном ценителе прекрасного и вечного. Московский купец Сергей Иванович Щукин творил историю, коллекционируя произведения искусства. Впоследствии именно его собрание стало основой для экспозиции французской модернистской живописи в Эрмитаже и Музее изобразительных искусств имени А. С. Пушкина.
                    - paragraph [ref=e646]: Но вернёмся к великому мастеру. Одна из самых его известных картин — "Танец". Исполнение в стиле "ню" и с использованием трех красок – синей, зеленой и оранжевой, создает атмосферу семейного тепла и одновременно радости бытия. Сейчас она признана величайшим образцом модернизма.
                    - paragraph [ref=e647]:
                      - img "Анри Матисс \"Танец\", 1910 г." [ref=e648]
                    - paragraph [ref=e649]: Вышеназванный коллекционер был восхищен данной работой 1909 года. Он заказал подобное творение у художника. И уже спустя год "Танец" украшал интерьер парадной лестницы особняка мецената. Вследствие национализации его картинной галереи советской властью, вторая авторская версия "Танца" оказалась в Эрмитаже. Первая же находится в Нью-Йорке.
                    - paragraph [ref=e650]: Коллекция Эрмитажа была бы неполной без работ великого мастера Пикассо. В музее 31 произведение мастера, среди которых поражают всякое воображение такие картины, как "Танец с покрывалами", "Любительница абсента" и многие другие. Несмотря на то, что образы в работах Пикассо облечены в формы “скульптурности” и несколько “примитивизированны”, они обладают магией. Как описывают эксперты, труды художники относятся к архаичному искусству, поэтому являются бесценными шедеврами.
                    - paragraph [ref=e651]:
                      - img "Пабло Пикассо \"Любительница абсента\". Живопись, 1901 г." [ref=e652]
                    - paragraph [ref=e653]: Одна из самых известных в мире работ русского авангардизма принадлежит Казимиру Малевичу. Знаменитый "Черный квадрат" с момента своего появления является источником непрекращающихся споров и полемических рассуждений среди художественной элиты и обычных зрителей. Сегодня можно смело заявить, что налицо – явный супрематизм.
                    - paragraph [ref=e654]: Данное направление было основано в авангардистском искусстве как разновидность абстракционизма в 1910-х годах и самим Малевичем. Для выражения идей используются простейшие геометрические формы и очертания. Сочетание разных красок и фигур под воздействием внутреннего движения образует уравновешенные композиции. Своей работой Малевич дал толчок формированию и развитию нового направления не только в художественном, но и дизайнерском искусстве.
                    - paragraph [ref=e655]: Ещё ярчайшим представителем русского авангардизма и одним из основоположников абстракционизма, полотна которого выставлены в самых известных музеях мира, является русский живописец — Василий Васильевич Кандинский. В Эрмитаже отдельный зал посвящен творчеству этого художника. Его "Композиция VI" привлекает яркими красками и размашистыми мазками. Картина как нельзя лучше предает атмосферу начала прошлого века, когда в стране и в мире происходили глобальные перемены.
                    - paragraph [ref=e656]:
                      - img "Василий Кандинский \"Композиция VI\"" [ref=e657]
                    - heading "Эрмитаж внутри фото" [level=3] [ref=e658]
                    - paragraph [ref=e659]: Парадная анфилада Зимнего дворца начинается от Иорданской лестницы и ведёт к Большому Тронному залу, или Георгиевскому залу, а также к Большой церкви Зимнего дворца. Залы дворца сохранили до наших дней свою историческую отделку, что даёт представление о парадных дворцовых интерьерах XIX века.
                    - paragraph [ref=e660]:
                      - 'img "Иорданская лестница в Зимнем дворце. Фото: MatthiasKabel (Wikimedia Commons)" [ref=e661]'
                    - paragraph [ref=e662]: Главную парадную анфиладу открывает Фельдмаршальский зал; с ним по соседству находится Петровский зал, который посвящён памяти императора Петра I; далее следует Гербовый зал – 2-й по величине парадный интерьер Зимнего дворца.
                    - paragraph [ref=e663]:
                      - 'img "Петровский (Малый тронный) зал Зимнего дворца. Фото: Ad Meskens (Wikimedia Commons)" [ref=e664]'
                    - paragraph [ref=e665]: Из Гербового зала есть возможность перейти в Военную галерею, которая создавалась как памятник воинской доблести России, победившей в Великой Отечественной войне 1812 года. Двери в центре Военной галереи ведут в Георгиевский зал, где проходили тронные церемонии.
                    - paragraph [ref=e666]:
                      - 'img "Георгиевский (Большой тронный) зал Зимнего дворца. Фото: Ad Meskens (Wikimedia Commons)" [ref=e667]'
                    - paragraph [ref=e668]: За Военной галереей расположено небольшое помещение – Предцерковье, расположенное в преддверии Большой церкви Зимнего дворца. А рядом находится Пикетный зал, за которым следует Александровский зал, названный в честь императора Александра I.
                    - paragraph [ref=e669]:
                      - 'img "Александровский зал, вид 2015 г. Фото: Poudou99 (Wikimedia Commons)" [ref=e670]'
                    - heading "Здания Эрмитажа" [level=2] [ref=e671]
                    - paragraph [ref=e672]: Современный Государственный Эрмитаж представляет собой сложный музейный комплекс. Основная экспозиционная часть музея занимает 5 зданий, расположенных вдоль набережной реки Невы, главным из которых принято считать Зимний дворец.
                    - paragraph [ref=e673]: Также музею принадлежат Восточное крыло Главного штаба на Дворцовой площади, Меншиковский дворец на другой стороне Невы, фондохранилище в "Старой Деревне" и другие здания.
                    - paragraph [ref=e674]:
                      - 'img "Эрмитаж. Фото: Florstein (WikiPhotoSpace)" [ref=e675]'
                    - heading "Главный музейный комплекс" [level=3] [ref=e676]
                    - paragraph [ref=e677]: "Главный музейный комплекс расположен по адресу: Дворцовая набережная, 32–38 и включает в себя 6 связанных между собой зданий — Зимний дворец, Запасной дом Зимнего дворца, Малый Эрмитаж, Большой (Старый) Эрмитаж, Новый Эрмитаж и Эрмитажный театр."
                    - paragraph [ref=e678]: В них открыты для посещения 365 залов. Также в распоряжении музея находятся Главный штаб, Музей Императорского фарфорового завода, реставрационно-хранительский центр "Старая Деревня" и Меншиковский дворец.
                    - paragraph [ref=e679]:
                      - 'img "Вид на Зимний дворец и Дворцовую площадь с высоты. Фото: Andrew Shiva / Wikipedia" [ref=e680]'
                    - heading "Зимний дворец" [level=3] [ref=e681]
                    - paragraph [ref=e682]: Туристы, которые приезжают в Санкт-Петербург, сразу же по приезду отправляется на его главную площадь — Дворцовую, чтобы полюбоваться на красивейший архитектурный ансамбль Зимнего дворца, являющийся символом, украшением и гордостью города, одним из самых значимых объектов отечественного и мирового паломничества.
                    - paragraph [ref=e683]: "Зимний дворец, главный императорский дворец России, расположен по адресу: Дворцовая площадь, 2 / Дворцовая набережная, 38. Современное здание дворца — 5-е по счёту, построенное в 1754—1762 годах русским архитектором итальянского происхождения Бартоломео Франческо Растрелли в стиле пышного елизаветинского барокко с элементами французского рококо в интерьерах."
                    - paragraph [ref=e684]: Монументальный и нарядный Зимний дворец является ярчайшим памятником стиля барокко. Здание представляет собой блестящий образец синтеза архитектуры и декоративной пластики. Всего за период 1711—1764 годов в городе на Неве на разных участках возводилось 5 зимних дворцов.
                    - paragraph [ref=e685]:
                      - img "Зимний дворец в 19 веке" [ref=e686]
                    - paragraph [ref=e687]: Сперва царь Пётр I в течение 5 лет проживал в построенном на скорую руку, всего за трёхдневный срок, в 1703 году недалеко от Петропавловской крепости одноэтажном доме. В дальнейшем государю потребовалась достойная зимняя резиденция.
                    - paragraph [ref=e688]: К тому времени он издал указ, согласно которому на берегах Невы запрещалось выделять наделы тем, кто не имел морского чина. Сам император, желая выстроить в центре города резиденцию, получил разрешение как мастер корабельных дел Пётр Алексеев.
                    - paragraph [ref=e689]: Так, Пётр Великий стал владельцем участка между Невой и Миллионной улицей, сейчас здесь расположен Эрмитажный театр. В 1708 году именно на этом месте, в глубине участка, был построен деревянный "Зимний дом" — небольшой двухэтажный дом с высоким крыльцом и черепичной крышей.
                    - paragraph [ref=e690]: В 1712 году тогдашний губернатор Санкт-Петербурга Александр Данилович Меншиков решил сделать подарок царю Петру I к его свадьбе с Екатериной Алексеевной, и пригласил архитектора Георга Маттарнови, который перестроил деревянный дом в каменный. Спустя 8 лет монаршее семейство перебралось в новые Зимние покои. Однако пожить в каменных "Свадебных палатах" счастливому мужу довелось только 5 лет.
                    - paragraph [ref=e691]:
                      - img "Первый дворец — Свадебные палаты" [ref=e692]
                    - paragraph [ref=e693]: Впоследствии на престол взошла Анна Иоанновна, сестра и соправительница Петра Великого, так как приходилась четвёртой дочерью царя Ивана Пятого. Она слыла женщиной, живущей с размахом, и неудивительно, что ей было тесно в петровских палатах.
                    - paragraph [ref=e694]: У новой императрицы были свои видения настоящей царской резиденции. Для её кардинальной реконструкции она пригласила гениального архитектора Франческо Растрелли. Дальше потребовался снос близлежащих строений. Всё произошло удачным образом, и в 1735 году Анна Иоанновна отмечала пышное новоселье.
                    - paragraph [ref=e695]: Зимний дворец уже состоял из 70 парадных залов, из более 100 спален. Нашлось пространство для галереи, театра и большой капеллы. Были тут помещения для канцелярии, караульной службы, прочие. Увы, и данных просторов позднее оказалось мало для правительницы. Поэтому буквально сразу стали вестись новые работы по усовершенствованию дворца.
                    - paragraph [ref=e696]:
                      - img "Третий дворец — дворец Анны Иоанновны" [ref=e697]
                    - paragraph [ref=e698]: Взошедшая на престол в 1741 году младшая дочь Петра Первого — Елизавета Первая пристроила к Зимнему служебные помещения. Как писали очевидцы того времени, дворец “представлял вид пестрый, грязный, недостойный места им занимаемого...”.
                    - paragraph [ref=e699]: Через пару лет императрица решила его расширить. Продолжилась скупка ближайших усадеб, и Растрелли возводил добавочные корпуса. Затем Елизавете пришло на ум поднять потолок с четырнадцати до двадцати двух метров. Архитектор, произведя расчёты, пришёл к выводу, что для этого потребуется переделка проекта, а это нелегкое дело, и он предложил выстроить дворец в иной местности, но хозяйка Зимнего и слышать не хотела о такой затее.
                    - paragraph [ref=e700]: Тогда пришлось выстроить абсолютно новое дворцовое строение. Возведение 4-ого Зимнего осуществлялось в рекордные сроки, в 1755 году работы уже были завершены. Простояло строение лишь до 1762-го года. Елизавете оно было не по душе. Она желала, чтобы резиденция русских царей роскошью и свежестью как внешнего, так и внутреннего убранства в разы затмевала европейские замки.
                    - paragraph [ref=e701]:
                      - img "Первоначально окраска дворца имела жёлтые оттенки, как у Версаля и Шёнбрунна" [ref=e702]
                    - paragraph [ref=e703]: Воплотить мечту русской царицы в жизнь вновь выпала честь это сделать Растрелли. Архитектор старался изо всех сил, чтобы угодить венценосной особе - 8 лет длилось строительство. Новое роскошное творение Растрелли включало полторы тысячи комнат, а общая площадь достигала шестидесяти тысяч квадратных метров. Более того, дворец возвышался над всеми городскими зданиями.
                    - paragraph [ref=e704]: Елизавете не суждено было пожить в чертоге собственной мечты. Работы принял Пётр III. По завершению отделки фасадов, новоявленный император уже думал о расчистке окрестностей. Его изобретательности нужно отдать должное. Он нашёл весьма оригинальный способ уборки места. Тонны остатков стройматериалов пришлось бы вывозить месяцами. Он издал указ, в котором разрешил всем желающим взять с дворцовой площади то, что понравится. К утру в округе и щепки нельзя было найти.
                    - paragraph [ref=e705]: После свержения Петра III окончательное возведение Зимнего дворца легло на плечи Екатерины II. Она тут же отказалась от услуг Растрелли и привлекла других архитекторов, работавших под неусыпном контролем ее личного секретаря Ивана Ивановича Бецкого.
                    - paragraph [ref=e706]:
                      - img "В середине XIX века в окраске дворца появились красные оттенки Шарлемань, Иосиф Иосифович" [ref=e707]
                    - paragraph [ref=e708]: В 1764 году Екатерина II получила 317 ценнейших картин из берлинской частной коллекции живописи Йоханна Эрнста Гоцковского в счёт его долга князю Владимиру Сергеевичу Долгорукову. Некоторые другие источники считают, что картин было всего 225.
                    - paragraph [ref=e709]: Как бы там ни было, но именно они положили начало собраниям Эрмитажа. "Эрмитаж" в переводе с французского языка означает "место уединения". Логично, ведь художественные шедевры нашли своё пристанище в уединённых апартаментах дворца. К 1775 году для коллекции полотен возвели отдельное здание.
                    - paragraph [ref=e710]: Дворец получился поистине шедевральным. Крылья здания, обращенные к Адмиралтейству, образуют парадный вход. Фасад, выходящий на Неву, украшен белыми колоннами, составляющими два яруса, чтобы подчеркнуть высоту здания и придать массивному сооружению легкость. Расстояние между колоннами различно, этот прием создает игру света и тени. Наличники окон украшены элементами, присущими барокко.
                    - paragraph [ref=e711]:
                      - img "Зимний дворец, 1764 г." [ref=e712]
                    - paragraph [ref=e713]: "Масштабы здания весьма впечатляют: высота — 23,5 метра; длина со стороны Невы — 210 метров, со стороны Адмиралтейства — 175; общее количество залов — 1050; окон — 1945; больших и малых лестниц — 117; крышу украшают 176 скульптур, которые чередуясь с вазами, оживляют строение."
                    - paragraph [ref=e714]: Император Николай I издал указ, регулирующий высоту столичных жилых домов, которая не должна была превышать 11 саженей (23,47 метра). Хотя это не говорилось прямо, но каждый знал, что царь не желает, чтобы в столице появились дома, выше его резиденции.
                    - paragraph [ref=e715]: Каждый император, восходивший на престол, вносил свои коррективы в облик Зимнего дворца или в его внутреннее убранство. При Николае I он стал поистине символом могущества Империи.
                    - paragraph [ref=e716]: Дворец не только многократно перестраивался и реконструировался, он пережил и немало других потрясений. Так, в декабре 1837 года в нем случился грандиозный пожар из-за недочетов в печном отоплении. Из пламени удалось вынести ценные картины, ковры, часть мебели и ценностей. Но само здание вместе с отделкой выгорело до основания - огонь полыхал трое суток.
                    - paragraph [ref=e717]:
                      - img "Пожар в Зимнем дворце Б Грин" [ref=e718]
                    - paragraph [ref=e719]: Благодаря усилиям архитекторов Стасова, Брюллова и Штауберту буквально за год были проведены восстановительные работы, и Зимний вновь стал главным дворцом страны. Зодчим удалось не только вернуть былое величие строению, но и внести изменения в проект, чтобы он соответствовал требованиям времени.
                    - paragraph [ref=e720]: Так, было введено аммосовое отопление, а перекрытия впервые в истории делались из металла. Здесь произошло покушение на Александра I, при котором погибли солдаты караула, но сам император не пострадал. Во время Первой мировой в здании был устроен госпиталь для раненых.
                    - paragraph [ref=e721]: После февральской революции в Зимнем расположилось Временное правительство. Его министры были арестованы большевиками в стенах дворца. Новая власть переименовала его и он стал Дворцом искусств. Но это название не прижилось в народе. Через две недели после Октябрьской революции дворец объявили музеем, а оставшиеся ценности были национализированы.
                    - paragraph [ref=e722]:
                      - img "Штурм Зимнего дворца. Кадр из фильма «Октябрь», 1927 г." [ref=e723]
                    - paragraph [ref=e724]: Еще одной сложной страницей в истории стала Великая Отечественная война. Экспозиция была вывезена, но само здание стало прекрасной мишенью для вражеской артиллерии. В подвалах были устроены бомбоубежища. Во избежание возгорания часть окон была заложена кирпичом, а полы из драгоценной древесины засыпаны песком.
                    - paragraph [ref=e725]: Было зафиксировано два прямых попадания авиабомб и семнадцати снарядов, выпущенных артиллерией. Но даже в годы войны и страшной блокады Ленинграда энтузиасты вели восстановление музея. Уже осенью победоносного 1945-го года он встретил первых посетителей.
                    - paragraph [ref=e726]: Современный Зимний дворец, выкрашенный в бело-зелёные тона, стал привычным видом центральной площади Петербурга. Но таким дворец стал лишь после войны. Изначально окраска стен была бледно-жёлтой, чтобы оттенять золотое убранство внутренних палат. При Павле I цвет стен стал более интенсивным. Александр I приказал выкрасить в жемчужный цвет. При Николае II фасад перекрашивался несколько раз то в розовый, то в красный, то в коричневый.
                    - paragraph [ref=e727]:
                      - img "20 июля 1914. Николай II объявляет войну Германии." [ref=e728]
                    - paragraph [ref=e729]: Зимний дворец вместе с Эрмитажем представляет собой уникальнейший и красивейший архитектурный комплекс. Ежегодно его посещает свыше двух миллионов туристов, около четвертой части из которых — иностранные.
                    - paragraph [ref=e730]: В Эрмитаже и в Зимнем дворце официально проживают коты и кошки. Более 50 этих хвостатых ежедневно несут вахту по ловле мышей. Причём, нынешние пушистые кошачьи — это потомки голландских котов, которых самолично завёз Петр Первый, а также казанских, выписанных Елизаветой Петровной.
                    - paragraph [ref=e731]: В течение 150 лет Зимний дворец служил парадной императорской резиденцией. В ноябре 1917 года он был объявлен музеем. Экспозиции, расположенные во дворце, представляют парадные залы и апартаменты, коллекции древностей Евразии и Востока, а также собрания живописи, скульптуры и декоративно-прикладного искусства Европы и Востока.
                    - paragraph [ref=e732]:
                      - img "Зимний дворец, 1960-е гг." [ref=e733]
                    - heading "Малый Эрмитаж" [level=3] [ref=e734]
                    - paragraph [ref=e735]: Малый Эрмитаж является памятником архитектуры. Корпуса здания, выходящие на Дворцовую набережную и Миллионную улицу, связывают барочный Зимний дворец и памятники классицизма — Большой Эрмитаж и Новый Эрмитаж.
                    - paragraph [ref=e736]: Екатерина Великая никогда не скрывала своего негативного отношения к Зимнему дворцу. По её мнению, он был слишком велик и неуютен для неё. Поэтому спустя два года после своей коронации императрица начала строительство более камерного дворца, в большей степени отвечающего её личным потребностям.
                    - paragraph [ref=e737]: Разработкой проекта и его воплощением в жизнь руководили два архитектора – Жан-Батист Валлен-Деламот и Юрий Фельтен. Начало строительства дворца относится к 1764 году, впоследствии его стиль будет признан как бы связующим звеном между архаичным барокко Зимнего дворца и прогрессивным классицизмом Нового Эрмитажа.
                    - paragraph [ref=e738]: Так, в 1764-1766 годах по желанию императрицы Екатерины II рядом с парадной резиденцией - Зимним дворцом - архитектор Ю. М. Фельтен возвел двухэтажный корпус. Черты уходящего барокко и зарождающегося классицизма органично соединились в облике этого здания, в пластичности его архитектурных объемов и изяществе убранства фасада.
                    - paragraph [ref=e739]:
                      - img "Ю. Фельтен. Продольный разрез Малого Эрмитажа. 1767 г." [ref=e740]
                    - paragraph [ref=e741]: Позднее, в 1767-1769 годах, архитектор Жан-Батист Валлен-Деламот построил на берегу Невы павильон с парадным залом, несколькими гостиными и оранжереей для уединенного отдыха императрицы. Здание, оформленное в стиле раннего классицизма, отличается строгими пропорциями, соразмерными архитектурным членениям Зимнего дворца. Ритм колоннады коринфского ордера, украшающей его второй ярус, выразительно подчеркивает художественное единство двух разных по стилю зданий.
                    - paragraph [ref=e742]: Первым был построен Южный павильон, выходящий на Миллионную улицу. Смысловым "ядром" дворца изначально задумывался Северный павильон (или Оранжерейный дом), фасад которого выходил на Дворцовую набережную. Но его проект императрица утвердила не сразу, а лишь после большого количества замечаний и корректировок.
                    - paragraph [ref=e743]:
                      - 'img "Малый Эрмитаж. Фото: Florstein (WikiPhotoSpace)" [ref=e744]'
                    - paragraph [ref=e745]: Поэтому возведение дворца началось с его менее значительной, южной, части. Северный и Южный корпуса соединены расположенным на уровне второго этажа Висячим садом, который по приказу Екатерины был засажен деревьями и кустарниками.
                    - paragraph [ref=e746]: По его сторонам были устроены галереи. Художественные коллекции, размещенные в продольных галереях, положили начало собраниям императорского музея. Под этим уникальным для России того времени архитектурным объектом располагались дровяные склады.
                    - paragraph [ref=e747]: Залы Малого Эрмитажа, примыкавшие с южной стороны к покоям императрицы, получили в народе название "фаворитского корпуса". Жильцами этой части дворца были посменно Орлов и Потёмкин.
                    - paragraph [ref=e748]:
                      - img "Э. Гау. Северный кабинет" [ref=e749]
                    - paragraph [ref=e750]: Оранжерейный дом вмещал в себя зимний сад c экзотическими растениями и птицами, а также несколько гостиных и залов. Здесь императрица проводила увеселительные музыкальные или театральные вечера в компании немногочисленных приближенных. Эти досуговые мероприятия она именовала "малыми эрмитажами", отсюда и название дворца.
                    - paragraph [ref=e751]: "Северный павильон был оснащён подъемным столом: сервировался тот на первом этаже, после чего поднимался наверх, в залы. В 40-х годах XIX века малый Эрмитаж был частично реконструирован под руководством архитектора Василия Стасова. Под висячим садом, на месте дровяных сараев, зодчий устроил манеж и конюшни. В трудные 30-е годы прошлого столетия администрация музея была вынуждена сдавать их конной школе."
                    - paragraph [ref=e752]: В наши дни в Малом Эрмитаже размещены коллекции западноевропейского прикладного искусства и живописи. В северной части комплекса находится Павильонный зал со знаменитыми часами "Павлин".
                    - paragraph [ref=e753]:
                      - 'img "Часы \"Павлин\" в Малом Эрмитаже. Фото: Antonio Zugaldia (Wikimedia Commons)" [ref=e754]'
                    - heading "Старый (Большой) Эрмитаж" [level=3] [ref=e755]
                    - paragraph [ref=e756]: Большой Эрмитаж является памятником архитектуры и продолжением дворцовых строений, расположившихся на набережной. Он строился по заказу императрицы Екатерины II для размещения дворцовых художественных коллекций и библиотеки в 1771-1787 годах.
                    - paragraph [ref=e757]: На берегу Невы возвели здание рядом с Малым Эрмитажем. Так как оно превосходило своими размерами последний, его стали называть Большим Эрмитажем. Созданное архитектором Ю. М. Фельтеном трёхэтажное строение органично вписалось в существовавший дворцовый ансамбль.
                    - paragraph [ref=e758]:
                      - img "Санкт-Петербург, Россия. Ансамбль Дворцовой набережной. Дом № 34 (Большой Эрмитаж). A.Savin (Wikimedia Commons · WikiPhotoSpace)" [ref=e759]
                    - paragraph [ref=e760]: Строгость и простота облика Большого Эрмитажа соответствовали духу классицизма XVIII века. Сооружение не имеет ордерных членений в виде колонн или пилястр. Но его конструкция строго подчинена пропорциям классического ордера. По высоте строение разделено на массивную рустованную нижнюю часть и облегченную верхнюю.
                    - paragraph [ref=e761]: Решение фасада построено на сочетании ритмов горизонтальных членений и вертикалей оконных проемов. В 1792 году Джакомо Кваренги пристроил к Большому Эрмитажу корпус, в котором разместились Лоджии Рафаэля - близкое к оригиналу повторение знаменитой галереи Папского дворца в Ватикане.
                    - paragraph [ref=e762]:
                      - 'img "Лоджии Рафаэля. Фото: Tura8 (Wikimedia Commons)" [ref=e763]'
                    - paragraph [ref=e764]: В Большом или Старом Эрмитаже расположена экспозиция, которая представляет искусство Италии эпохи Возрождения, которую могут увидеть все желающие.
                    - paragraph [ref=e765]:
                      - img "Тициан Св. Себастьян" [ref=e766]
                    - heading "Эрмитажный театр" [level=3] [ref=e767]
                    - paragraph [ref=e768]: История старейшей театральной площадки Санкт-Петербурга берёт свое начало ещё со времен царствования Елизаветы Петровны. Тогда, в 1754 году, в западном крыле Зимнего Дворца началось строительство Оперного дома по проекту архитектора Франческо Растрелли. Первая премьера здесь состоялась спустя десять лет, уже при Екатерине II.
                    - paragraph [ref=e769]: Интересный факт состоит в том, что строительство фасада Эрмитажного театра началось лишь после того, как были полностью отстроены его сцена и зал. До завершения работ внутренние помещения прикрыли фасадом Лейб-кампанского корпуса, который находился на месте личного дворца Петра I до начала строительства театра
                    - paragraph [ref=e770]: Великая императрица высоко ценила роль сценического искусства в духовном становлении общества, поэтому вскоре приняла решение о строительстве отдельного театрального здания. Оперный дом пополнил фонд жилых покоев Зимнего Дворца.
                    - paragraph [ref=e771]: Разработка проекта нового театра началась в 1783 году. После недолгих раздумий Екатерина решила, что здание должно быть возведено на месте бывшей личной резиденции Петра I, с использованием имеющегося фундамента.
                    - paragraph [ref=e772]: "Строительными работами и внутренней отделкой театра руководил последователь античного стиля в архитектуре Джакомо Кваренги. Этим объясняются множественные древнегреческие мотивы в интерьере театрального зала. Дважды императрица повелевала внести изменения в уже строящееся здание: по ее воле зрительный зал и сцену значительно увеличили."
                    - paragraph [ref=e773]:
                      - img "Кваренги. Проект зрительного зала" [ref=e774]
                    - paragraph [ref=e775]: Постройка и отделка Эрмитажного театра были полностью завершены в 1802 году, однако творческая деятельность в нём стартовала еще в 1785-м, когда на здешних подмостках состоялась первая премьера – опера "Мельник колдун, обманщик и сват". После этого репертуар театра начали наполнять не только российскими, но и европейскими произведениями.
                    - paragraph [ref=e776]: В партере театра обустроили специальные места для императрицы и для приглашенных лично нею высокопоставленных гостей. Остальная публика занимала места произвольно. Говоря современным театральным языком, в зале существовала "свободная рассадка".
                    - paragraph [ref=e777]: При Павле I театр на некоторое время закрыли. Позже заведение возобновило свою работу – уже со строгой цензурой, без допущения в репертуар пьес, несущих просветительские идеи запада. Александр I, ставивший военное искусство превыше сценического, отдал театр под кавалерийские нужды, чем нанес непоправимый урон его интерьерам.
                    - paragraph [ref=e778]:
                      - 'img "Фойе над аркой. Оформ. Л. Н. Бенуа. Фото: Tura8 (Wikimedia Commons)" [ref=e779]'
                    - paragraph [ref=e780]: "В начале ХХ века Эрмитажный театр реставрировали и восстановили, но с приходом Советской власти его открытие отложилось на долгие годы. Лишь в 1931 году было принято решение вернуть площадке её изначальные функции: здесь стали проводиться концерты. После масштабной реконструкции и ремонта в 1980-х годах эрмитажная сцена вновь выступила в качестве полноценного театра."
                    - paragraph [ref=e781]: Здание Эрмитажного тетра, отличающееся гармонией и сбалансированностью архитектурных форм, является прекрасным образцом русского классицизма конца XVIII века. Рустованные окна первого этажа украшены замковыми камнями с львиными масками – излюбленным элементом архитектора Кваренги.
                    - paragraph [ref=e782]: Стройная колоннада второго яруса фасада фланкирована ризалитами с расположенными в нишах статуями древнегреческих драматургов и поэтов. Зрительный зал театра устроен в виде амфитеатра с 6-ю рядами скамей.
                    - paragraph [ref=e783]: Его стены облицованы искусственным мрамором и оформлены колоннами, капители которых украшены сценическими масками. Над установленными в нишах скульптурами Аполлона и муз помещены медальоны с профильными изображениями выдающихся драматургов. Сцена отделена от зала балюстрадой, за которой находятся еще несколько рядов скамей и две боковые ложи.
                    - paragraph [ref=e784]: С XVIII века театральные спектакли при царском дворе стали традиционными и сопутствовали многим празднествам. Сегодня он полностью оборудован специальной сценической техникой, здесь проходят спектакли лучших музыкальных коллективов страны, в том числе, и Мариинского театра. Также в его фойе устраивают выставки.
                    - paragraph [ref=e785]:
                      - 'img "Ансамбль Дворцовой набережной. Дом № 32 (Эрмитажный театр). Фото: A.Savin (Wikimedia Commons · WikiPhotoSpace)" [ref=e786]'
                    - heading "Новый Эрмитаж" [level=3] [ref=e787]
                    - paragraph [ref=e788]: Новый Эрмитаж стал первым зданием в России, возведённым специально для размещения художественных коллекций музея. Созданное ещё Екатериной Великой музейное собрание со временем переросло объёмы Малого Эрмитажа, после чего было заложено здание Большого Эрмитажа. Впоследствии весь дворцовый комплекс сильно пострадал во время пожара 1837 года.
                    - paragraph [ref=e789]:
                      - img "Новый Эрмитаж. Старые фото" [ref=e790]
                    - paragraph [ref=e791]: Николай I счёл целесообразным помимо восстановительных работ в старых зданиях возвести новое, которое должно было стать открытой экспозицией художественных богатств Зимнего дворца. Так, был основан первый российский музей. Здание, изначально предназначенное для выставочных целей, получило название Новый Эрмитаж.
                    - paragraph [ref=e792]: Для создания проекта и строительства музея был приглашён европейский архитектор Лео фон Кленце, бывший приверженцем античного стиля в искусстве. Поэтому здание Нового Эрмитажа несёт в себе пропорции и каноны древнегреческой архитектуры.
                    - paragraph [ref=e793]:
                      - img "Новый Эрмитаж в XIX веке, литография по рисунку И. Шарлеманя" [ref=e794]
                    - paragraph [ref=e795]: Стоит, однако, отметить, что русский архитектор Василий Стасов, осуществлявший контроль над восстановительными работами дворцового комплекса, был уполномочен по своему усмотрению вносить коррективы в проект иностранца – для сохранения художественной целостности архитектурного ансамбля.
                    - paragraph [ref=e796]: Вход в музей акцентирован величественным портиком с фигурами атлантов, высеченными из серого сердобольского гранита в мастерской скульптора Александра Теребенёва. Здание украшают статуи и барельефы, изображающие знаменитых художников, архитекторов, скульпторов прошлых эпох. Крупные плоскости фасадов оживляет орнаментальный декор с античными, ренессансными и барочными декоративными мотивами.
                    - paragraph [ref=e797]:
                      - img "Новый Эрмитаж. Старые фото" [ref=e798]
                    - paragraph [ref=e799]: "Знаменитые атланты при входе в Новый Эрмитаж стали одним из самых известных символов Петербурга. Торжественное открытие музея состоялось 5 февраля 1852 года. В первые годы своего существования Новый Эрмитаж был доступен только для избранных: пригласительные билеты выдавались строго Придворной конторой. Сам Император ежедневно посвящал общению с искусством полтора часа – с половины первого до двух."
                    - paragraph [ref=e800]: "В это время вход в музей был строго воспрещен. Дозволенное время для посещений экспозиции составляло лишь пару часов в день: удостоенные такого права могли находиться в здании Нового Эрмитажа лишь в самой торжественной форме одежды. Во время царствования Александра II доступ к собранию музея стал возможен для всех желающих."
                    - paragraph [ref=e801]:
                      - 'img "Вход в Новый Эрмитаж. Фото: GAlexandrova (Wikimedia Commons)" [ref=e802]'
                    - paragraph [ref=e803]: "Новому Эрмитажу, построенному в 1842-1851 годах в стиле \"историзм\", присущи строгость и монументальность облика, сбалансированностью архитектурных объёмов. Внутреннее убранство \"Музеума\" соответствовало характеру представляемых коллекций: в роскошных залах с верхним светом (Просветах) на втором этаже разместилась Картинная галерея, а в залах первого этажа, оформленных в духе античной архитектуры, - коллекция древностей, скульптур, несколько библиотек."
                    - paragraph [ref=e804]: Залы Нового Эрмитажа сохранили до наших дней свой исторический облик, что само по себе привлекает внимание туристов. Плюс, в них расположены коллекции античного искусства, а также живописи, скульптуры и декоративно-прикладного искусства Европы.
                    - paragraph [ref=e805]:
                      - img "Новый Эрмитаж. Старые фото" [ref=e806]
                    - heading "Запасной дом Зимнего дворца" [level=3] [ref=e807]
                    - paragraph [ref=e808]: "Запасной дом, расположенный по адресу: Дворцовая набережная, дом № 30 литера А, известен ещё как Дом Скляева, – особняк, построенный в конце XIX века архитектором Николаем Беккером на месте более старых построек XVIII века для великого князя Алексея Александровича."
                    - paragraph [ref=e809]: Нынешний облик здание приобрело в 70-е годы XIX века. В 1885 году дом перешёл во владение графа Георгия Менгдена, но несколько лет спустя вновь вернулся в собственность ко двору, восстановив свой статус запасного дома Зимнего дворца.
                    - paragraph [ref=e810]: Это участок на Дворцовой набережной, где сейчас находится Запасной дом Зимнего дворца, пережил долгую историю – он многократно менял владельцев, служил различным целям. Изначально на этом месте был построен двухэтажный деревянный дом, принадлежавший корабельному мастеру Феодосию Скляеву.
                    - paragraph [ref=e811]:
                      - img "Дом Скляева (слева) и Зимний дворец Петра I (справа) Georg Johann Mattarnovy" [ref=e812]
                    - paragraph [ref=e813]: Петр I, превыше всех государственных чинов ценивший судостроителей, поселил по правую руку от царской резиденции своего друга детства. Скляев был не только "воякой", состоявшем в потешном войске Петра I, но и другом царя в годы юности. Они вместе постигали плотницкое дело в Голландии, а впоследствии Скляев следил за строительством Зимнего дворца.
                    - paragraph [ref=e814]: После смерти Феодосия Скляева дом его отошёл казне. Анна Иоанновна подарила его Густаву Бирону – брату своего знаменитого фаворита. Будучи перестроенным по проекту архитектора Доменико Трезини, дом несколько раз сменил хозяев. Графиня Воронцова пристроила к нему несколько доходных флигелей, один из которых сдавала Преображенскому полку. В середине XIX века весь комплекс был снова выкуплен казной и стал Запасным домом Зимнего дворца.
                    - paragraph [ref=e815]:
                      - img "Аксонометрический план 1760-х гг. Фрагмент" [ref=e816]
                    - paragraph [ref=e817]: В 1878 году в результате последней перестройки по проекту архитектора Николая Беккера здание приобрело свой современный облик. Он принадлежал Великому князю Алексею Александровичу до того, как тот обзавелся дворцом на Мойке. После дом на Дворцовой набережной перешёл в руки графа Георгия Менгдена, который обустроил его под доходный дом.
                    - paragraph [ref=e818]: В послереволюционные годы Запасной дом Зимнего дворца был отдан Отделу охраны памятников, затем стал жилым. Здесь были расселены сотрудники Академии наук и служащие Эрмитажа.
                    - paragraph [ref=e819]: "С 2012 года особняк включён в реестр объектов культурного наследия. В настоящее время он находится в ведении Государственного Эрмитажа: в нём находятся музейные реставрационные мастерские."
                    - paragraph [ref=e820]:
                      - 'img "Санкт-Петербург, Россия. Ансамбль Дворцовой набережной. Дом № 30 (относится к музею Эрмитаж). Фото: A.Savin (Wikimedia Commons · WikiPhotoSpace)" [ref=e821]'
                    - heading "Главный штаб" [level=3] [ref=e822]
                    - paragraph [ref=e823]: Главный штаб входит в экспозиционный комплекс Государственного Эрмитажа, который расположен в самом центре Северной столицы — на Дворцовой площади. Главный штаб Эрмитажа занимает восточное крыло легендарного полукруглого здания, берущего начало от реки Мойки и простирающегося до Невского проспекта.
                    - paragraph [ref=e824]:
                      - img "Первоначальный проект, 1820 год, вид с Дворцовой площади. Литография К. Беггрова" [ref=e825]
                    - paragraph [ref=e826]: Сооружение было построено в стиле "ампир" выдающимся архитектором русского классицизма Карлом Ивановичем Росси в 1820-1830 годах. В царское время здесь размещались государственные службы, министерские кабинеты. После Великой Октябрьской революции 1917 года их заняли комиссариаты нового рабочего правительства, был даже милицейский пост.
                    - paragraph [ref=e827]:
                      - img "Дворцовая площадь, 1917 г." [ref=e828]
                    - paragraph [ref=e829]: Две части дворца объединяет в один комплекс монументальная Триумфальная арка. Это грандиозное сооружение возведено на финальном этапе строительства. Арка символизирует победу русского воинства над французскими полками в Отечественной войне 1812 года.
                    - paragraph [ref=e830]:
                      - img "Первоначальный проект, 1820 год, вид с Дворцовой площади. Литография К. Беггрова" [ref=e831]
                    - paragraph [ref=e832]: На символической колеснице торжественно восседает Слава – богиня победы, которая держит венок победителя из лаврового дерева в одной руке и изображение двуглавого орла - в другой. Воины в латах управляют упряжкой летящих коней. Арку украшают фигуры античных богов и героев. Поддерживается огромный просторный свод белоснежными колоннами.
                    - paragraph [ref=e833]:
                      - 'img "Арка Главного штаба. Фото: Lelik (Wikimedia Commons)" [ref=e834]'
                    - paragraph [ref=e835]: Под сводом арки установлены первые часы, работающие на электричестве, в 1905 году для Казначейства. Основной комплекс Эрмитажа занимает только восточную часть здания. Остальной его площадью владеет военный округ. В результате последней реконструкции внутреннего убранства и двориков 2004 – 2014 годов здание полностью превратилось в музейный комплекс.
                    - paragraph [ref=e836]:
                      - 'img "Часы Менделеева — элемент декора. Фото: Panther (Wikimedia Commons)" [ref=e837]'
                    - paragraph [ref=e838]: Внутренние дворики с застеклёнными куполами объединили территорию Генерального штаба, а современные стеклянные переходы связывают большие экспозиционные залы. Гостей музея встречает главная лестница Генерального штаба.
                    - paragraph [ref=e839]: Широкие мраморные пролёты придают ощущение монументальности и торжественности зданию. Отличительной чертой реконструкции является гармоничное сочетание авангардных решений с классическим стилем исторического здания.
                    - paragraph [ref=e840]:
                      - img "Строительство купола над библиотекой ГШ, 1902—1905 гг." [ref=e841]
                    - paragraph [ref=e842]: На 4-х этажах Главного штаба Эрмитажа размещены полотна зарубежных и русских мастеров. Знаменитые картины французских живописцев XIX-XX веков расположены на 4-м этаже. Ранее эти картины выставлялись в Зимнем дворце.
                    - paragraph [ref=e843]: Первый зал открывается работами Клода Моне. Нежные и солнечные краски его пейзажей соседствуют с танцовщицами Дега. Продолжают экспозицию работы Писсаро, Сислея, Фантена – Латура.
                    - paragraph [ref=e844]:
                      - 'img "Воссозданный_музыкальный_салон_Морозова. Фото: Tura8 (Wikimedia Commons)" [ref=e845]'
                    - paragraph [ref=e846]: Большая коллекция работ Огюста Ренуара занимает 2 зала. Лаконичные и выразительные портреты – вершина мастерства импрессионистов. Продолжают галерею портретов работы Поля Сезанна. Тут же во всей красе представлены его знаменитые натюрморты и пейзажная живопись.
                    - paragraph [ref=e847]: Поль Гоген выделяется из вереницы мастеров угловатыми и сочными фигурами таитянок, девственной "до дикости" природой тропического острова. Созвучна его картинам страстная манера письма Винсента Ван Гога. Простые и запоминающиеся арльские дамы, приглушённые и насыщенные оттенки пейзажей.
                    - paragraph [ref=e848]: Художники ХХ века представлены творчеством Анри Матисса и Пабло Пикассо. Монументальная и экспрессивная картина Матисса "Танец" завораживает необычными страстными движениями.
                    - paragraph [ref=e849]: На 2-м этаже музея развернута экспозиция предметов декоративного искусства "Искусство эпохи модерна". Ранее часть здания принадлежала Министерству внутренних дел Российской империи. Небольшая экспозиция рассказывает о его истории.
                    - paragraph [ref=e850]:
                      - 'img "Воссозданный_музыкальный_салон_Морозова. Фото: Tura8 (Wikimedia Commons)" [ref=e851]'
                    - paragraph [ref=e852]: С работами великих российских художников XIX-XX веков можно познакомиться на 3-м этаже. Картины Брюллова, Кустодиева и Петрова – Водкина располагаются на одной линии. Противоположная сторона этажа представляет выставку военных доспехов, обмундирования и клинков петровских времен. Здесь выставлен подлинный мундир Петра Великого - офицера Преображенского полка.
                    - paragraph [ref=e853]: Один из залов 3-го этажа интересен выставкой шедевров российских ювелиров и камнерезов. В этих комнатах хранятся лучшие работы придворного ювелира последнего императора России — Карла Фаберже. Современное обновлённое здание вмещает искусство всех времён на одном пространстве.
                    - paragraph [ref=e854]: "Восточное крыло здания Главного штаба является новым экспозиционным комплексом Государственного Эрмитажа. Основные экспозиционные помещения объединены в три анфиладные линии: Дворцовую линию (вдоль Дворцовой площади), Певческую линию (вдоль Певческого проезда), Речную линию (вдоль набережной реки Мойки) и дополнены центральной Большой анфиладой внутренних дворов-атриумов."
                    - paragraph [ref=e855]:
                      - 'img "Восточное крыло Главного штаба. Фото: Florstein (WikiPhotoSpace)" [ref=e856]'
                    - paragraph [ref=e857]: В экспозиционную зону из парадного входного вестибюля ведёт величественная лестница, размещённая в самом большом из 5-ти внутренних дворов. Помимо основных экспозиций музей можно посещать ради выставок современного искусства, которые нередко проводятся на всероссийском и международном уровнях.
                    - paragraph [ref=e858]: Главный штаб является главной музейной площадкой для показа современного искусства. Здесь разрешается фотографировать экспонаты, что является редкостью для многих музеев.
                    - paragraph [ref=e859]:
                      - 'img "Музейный комплекс Государственного Эрмитажа в Главном штабе. Фото: spbgasu.ru" [ref=e860]'
                    - heading "Зимний дворец Петра I" [level=3] [ref=e861]
                    - paragraph [ref=e862]: Зимний дворец Петра I — личная резиденция императора Петра I, расположен на Дворцовой набережной, 32 – на берегу Невы, у Зимней канавки. Зимний дворец Петра I тоже входит в экспозиционный комплекс Государственного Эрмитажа и являет собой уникальный архитектурно-мемориальный памятник первой четверти ХVIII века.
                    - paragraph [ref=e863]:
                      - img "Г. Маттарнови. Проект фасада. 1716 г." [ref=e864]
                    - paragraph [ref=e865]: Официальная резиденция Петра I располагалась на территории, которую ныне занимает Эрмитажный театр. В сохранившейся части дворца разместилась мемориальная экспозиция, посвящённая Петру Великому и его эпохе.
                    - paragraph [ref=e866]:
                      - 'img "Зимний дворец Петра I. Аркада парадного двора. Фото: Tura8 (Wikimedia Commons)" [ref=e867]'
                    - paragraph [ref=e868]: В комнатах Петра Великого, в частности, - его Кабинете, Столовой и Токарне воссоздана обстановка, включающая подлинные предметы, принадлежавшие государю. Также тут экспонируется так называемая "Восковая персона" - посмертный скульптурный портрет Петра I.
                    - paragraph [ref=e869]:
                      - 'img "Восковая персона Петра I. Фото: Korneevyshka (Wikimedia Commons)" [ref=e870]'
                    - paragraph [ref=e871]:
                      - 'img "Зимний дворец Петра I. Столовая. Фото: Tura8 (Wikimedia Commons)" [ref=e872]'
                    - heading "Музей Императорского фарфорового завода" [level=3] [ref=e873]
                    - paragraph [ref=e874]: Музей Императорского фарфорового завода расположен в Санкт-Петербурге и можно посетить всем желающим, чтобы полюбоваться на самый красивый и утончённый фарфор, который только изготавливали в России.
                    - paragraph [ref=e875]: Секреты изготовления оригинального мягкого фарфора на протяжении многих столетий держались в строжайшей тайне. Русские мастера пытались разгадать рецепт, экспериментируя и придумывая что-то новое. Но все попытки не увенчивались успехом. Однако молодому и талантливому ученому Дмитрию Ивановичу Виноградову удалось изготовить нечто особенное. Благодаря ему в середине XVIII века был изобретен твердый фарфор, поразивший Европу своими уникальными и необычными свойствами.
                    - paragraph [ref=e876]: Вставшая на престол дочь Петра I – императрица Елизавета Петровна, будучи женщиной умной и образованной, издала указ, согласно которому в 1744 году была основана Порцелиновая мануфактура.
                    - paragraph [ref=e877]:
                      - img "Экспозиция музея Императорского фарфорового завода. Государственный Эрмитаж" [ref=e878]
                    - paragraph [ref=e879]: После этого события фарфоровая промышленность стала развиваться стремительными темпами. Завод стал производить тарелки и подносы, а впоследствии был изготовлен и первый чайный сервиз, а затем и столовый, которые впоследствии в качестве дара были преподнесены Елизавете Петровне. Шло время, искусство изготовления фарфоровых изделий оттачивалось, накапливался опыт и знания.
                    - paragraph [ref=e880]: Спустя век, поддерживая традиции производства изящных изделий из фарфора, император Николай I в 1844 году решил организовать музей, в котором можно было бы демонстрировать предметы из русского фарфора. Музей находился при самом здании завода.
                    - paragraph [ref=e881]: Основной причиной создания музея стала необходимость в хранении уникальных и ценных образцов фарфорового искусства, которые могли служить превосходным примером для последующих поколений мастеров.
                    - paragraph [ref=e882]: Стоит отметить, что музей Императорского фарфорового завода является одним из самых старейших, он был основан раньше Русского музея и Третьяковской галереи. Император Александр III не забыл о существовании музея и в конце XIX века издал указ, в котором постановил изготавливать все изящные и великолепные фарфоровые предметы, предназначенные для членов императорской семьи, в двух экземплярах.
                    - paragraph [ref=e883]: Один из них должен украшать собой стеллажи музея, демонстрируя мастерство русских умельцев. Традиция поддерживалась и приобрела популярность, поэтому фонд музея стал регулярно пополняться новыми оригинальными и красивыми изделиями.
                    - paragraph [ref=e884]:
                      - img "Экспозиция музея Императорского фарфорового завода. Государственный Эрмитаж" [ref=e885]
                    - paragraph [ref=e886]: Уникальный музей обладает одной из самых ценных коллекций фарфоровых предметов завода. Здесь можно увидеть и самые первые экземпляры фарфора отечественного производства, которые были созданы еще в XVIII веке талантливым умельцем Д. И. Виноградовым, и современные изделия, отличающиеся особым стилем и утончённостью.
                    - paragraph [ref=e887]: Самые ранние изделия, произведенные Д. И. Виноградовым, которые, к счастью, смогли сохраниться до наших дней, датируется 1748 годом. Сотрудники и специалисты музея тщательно и с большой ответственностью сформировывали эксклюзивную и уникальную в своем роде коллекцию. Её аналогов нет ни в одной стране мира. Хрупкие экспонаты музея демонстрируют все этапы истории фарфорового завода, отражая в изделиях особенности производства того или иного периода.
                    - paragraph [ref=e888]: В фонде музея Императорского фарфорового завода насчитывается более 30 000 самых разных фарфоровых предметов. Среди них можно увидеть и получить эстетическое наслаждение не только от изделий из фарфора и стекла Императорских заводов, но и ознакомиться и изучить экземпляры советского периода, а также с интересными предметами, произведенными известными европейскими заводами. Кроме того, в музее представлены на обозрение яркие и примечательные примеры китайского и японского фарфорового мастерства.
                    - paragraph [ref=e889]:
                      - img "Экспозиция музея Императорского фарфорового завода. Государственный Эрмитаж" [ref=e890]
                    - paragraph [ref=e891]: Помимо фарфора музей располагает достаточно обширной библиотекой, которая была основана во второй половине XIX века. В ней находятся очень редкие и ценные экземпляры книг, повествующих о сути фарфорового искусства.
                    - paragraph [ref=e892]: Неудивительно, что располагая такой обширной и уникальной коллекцией, музей имеет свою книгу Почётных гостей. В ней оставили свой след члены императорской семьи. Кроме того, там стоят автографы таких великих и знаменитых людей, как Каземир Малевич, Максим Горький, Анатолий Луначарский, Федор Шаляпин, Сергей Есенин, Зинаида Райх, Владимир Маяковский.
                    - paragraph [ref=e893]: Удостоили своим присутствием музей и министр культуры СССР Елена Фурцева и первая женщина, которая покорила космос, Валентина Терешкова. В книге расписались и Генеральный секретарь ЦК КПСС Леонид Брежнев, и самый первый мэр Санкт-Петербурга Анатолий Собчак. Перечень знаменитых и известных личностей можно продолжать бесконечно.
                    - paragraph [ref=e894]: "Особого внимания заслуживают фарфоровые предметы, датируемые XVIII-XIX веками, которые были изготовлены по заказу знатных особ: разнообразные сервизы, изящные вазы, эксклюзивные табакерки и другие изделия. \"Агитационный фарфор\", относящийся к послереволюционной эпохе, также вызывает у современных посетителей большой интерес."
                    - paragraph [ref=e895]: Музей Императорского фарфорового завода является уникальным местом, где хранятся свыше 2-х веков культура и история России, искусно материализованная при помощи фарфора. Музей расположен на проспекте Обуховской Обороны,
                    - paragraph [ref=e896]:
                      - 'img "Музей Императорского фарфорового завода. Фото: ipm.ru" [ref=e897]'
                    - heading "Эрмитаж в Санкт-Петербурге сегодня" [level=2] [ref=e898]
                    - paragraph [ref=e899]: Государственный Эрмитаж в Санкт-Петербурге представляет огромный историко-культурный и художественный интерес для туристов из России и всего мира. В одном только Зимнем дворце общее количество посетителей в год составляет более 2 миллионов человек, из них около полумиллиона — иностранцы.
                    - heading "Официальный сайт Эрмитажа" [level=3] [ref=e900]
                    - paragraph [ref=e901]: "На главной странице официального сайта Эрмитажа размещены следующие разделы: Посетителям, Виртуальный визит, Выставки и события, Наука и публикации, Научные конференции в Эрмитаже, Новости, Поддержка музея, Главная страница Клуба Друзей Эрмитажа, Программы, О музее."
                    - list [ref=e902]:
                      - listitem [ref=e903]: "Официальный сайт Государственного Эрмитажа: hermitagemuseum.org"
                    - paragraph [ref=e904]:
                      - 'img "Главный вход с Дворцовой площади через арки Зимнего дворца. Вечерний вид. Фото: Mkrtchyan Karen (Wikimedia Commons)" [ref=e905]'
                    - heading "Эрмитаж онлайн" [level=3] [ref=e906]
                    - paragraph [ref=e907]: Государственный Эрмитаж в Санкт-Петербурге проводит онлайн экскурсии по своим залам. Можно забить в поисковик "Виртуальный Эрмитаж", и вам откроется бесплатная программа экскурсий по музею. Действует программа "Виртуальный визит". Туры проводятся по 3-м этажам музея, а также во всех его филиалах. Стоит только войти на страницу проекта.
                    - heading "Виртуальный визит" [level=3] [ref=e908]
                    - paragraph [ref=e909]:
                      - text: Здесь вы можете виртуально пройтись буквально по всем залам Эрмитажа, заглянуть в Бриллиантовую и Золотую кладовые, посмотреть на ювелирную коллекцию, в которые входят изделия разных эпох — от скифских золотых украшений до работ Карла Фаберже. Можно онлайн посетить текущие выставочные проекты. Даже есть возможность совершить онлайн-прогулку вокруг Главного музейного комплекса (
                      - link "ссылка" [ref=e910] [cursor=pointer]:
                        - /url: https://hermitagemuseum.org/wps/portal/hermitage/panorama
                      - text: ).
                    - heading "Онлайн программа в Эрмитаже" [level=3] [ref=e911]
                    - paragraph [ref=e912]: Как сообщается на сайте Государственного Эрмитажа, доступность музейных коллекций обеспечивается широкой программой онлайн-трансляций по залам и выставкам, в том числе и уже подготовленным к открытию, показов фильмов, программ и лекций об Эрмитаже.
                    - paragraph [ref=e913]: Их можно будет увидеть в официальных сетях музея и на сайте c 10:30 и до 18:00 — в обычные часы работы Эрмитажа (online.hermitage.ru). Тем, кто хочет вдумчиво и неторопливо прогуляться по залам музея, предлагают посмотреть недавно вышедший фильм "Эрмитаж. Снято на iPhone" — кинопутешествие по музею длиной 5 часов 20 минут, который доступен в официальной группе Эрмитажа "ВКонтакте" (vk.com/videos-67940544). Следите за анонсами.
                    - paragraph [ref=e914]: Благодаря пятичасовому фильму, который был снят на IPhone, можно познакомиться с развитием искусства от глубокой древности до наших дней. Маршрут проходит по 45 залам и показывает почти 600 произведений искусства из собрания Эрмитажа. Вы увидите основные работы периода XVIII-ХХ веков. Посмотрите фильм (vk.com/hermitage_museum).
                    - heading "Проект \"В фокусе\"" [level=3] [ref=e915]
                    - paragraph [ref=e916]:
                      - text: Недавно запущенный проект рассказывает о выдающихся произведениях искусства, культурных и исторических артефактах из коллекции музея, а также о работе музейных специалистов. А ещё позволяет прикоснуться к тайнам, заглянуть за закрытые двери хранилищ и лабораторий, где происходит реставрация и рассмотреть в мельчайших подробностях великие творения из собрания музея (
                      - link "hermitagemuseum.org" [ref=e917] [cursor=pointer]:
                        - /url: https://hermitagemuseum.org/wps/portal/hermitage/explore/infocus/!ut/p/z0/04_Sj9CPykssy0xPLMnMz0vMAfIjo8zi_R0dzQyNnQ28LMJMzA0cPULMff1CDP1N3A31C7IdFQGdHdd6/
                      - text: )
                    - heading "Прямые эфиры в Инстаграм" [level=3] [ref=e918]
                    - paragraph [ref=e919]: "В официальном инстаграм аккаунте музея его сотрудники охотно общаются с посетителями, проводят прямые эфиры и рассказывают о различных интересных экспонатах Эрмитажа. Также все экскурсии можно увидеть в архивах. Официальные каналы музея: ВКонтакте и Youtube. Ещё есть возможность самостоятельно осмотреть экспонаты, на официальном сайте Эрмитажа опубликована схема всего музея (nemiga.info/peterburg/plan-ermitazha.htm)."
                    - list [ref=e920]:
                      - listitem [ref=e921]:
                        - link "Онлайн экскурсии по главным музеям Санкт-Петербурга" [ref=e922] [cursor=pointer]:
                          - /url: https://peterburg.center/ln/onlayn-ekskursii-po-muzeyam-sankt-peterburga.html
                    - paragraph [ref=e923]:
                      - iframe [ref=e924]:
                        
                    - heading "Купить билеты онлайн" [level=2] [ref=e925]
                    - paragraph [ref=e926]: Государственный Эрмитаж осуществляет продажу электронных входных билетов для посещения музея индивидуальными посетителями.
                    - heading "Новые правила" [level=3] [ref=e927]
                    - paragraph [ref=e928]: Государственный Эрмитаж вводит временные правила приема посетителей – для визита в музей билеты можно приобрести онлайн только на определенные сеансы и маршруты. Эти меры позволят распределить потоки людей и обеспечить санитарно-эпидемиологическую безопасность, как для посетителей, так и для сотрудников музея.
                    - heading "Доступные билеты" [level=3] [ref=e929]
                    - paragraph [ref=e930]:
                      - text: На музейном сайте
                      - link "tickets.hermitagemuseum.org" [ref=e931] [cursor=pointer]:
                        - /url: https://tickets.hermitagemuseum.org
                      - text: для приобретения доступны билеты в Главный музейный комплекс и на экскурсию в Золотую кладовую Галереи драгоценностей, а также в остальные обособленные объекты Эрмитажа – Главный Штаб, Зимний дворец Петра I, Дворец Меншикова, Музей Императорского фарфорового завода и Реставрационно-хранительский центр "Старая Деревня".
                    - paragraph [ref=e932]:
                      - 'img "Государственный Эрмитаж в VK. фотография: альбуминовый отпечаток" [ref=e933]'
                    - paragraph [ref=e934]
                    - paragraph [ref=e935]:
                      - img "Эрмитаж внутри. Старые фото" [ref=e937]
                    - paragraph [ref=e938]
                    - paragraph [ref=e939]:
                      - img "Эрмитаж внутри. Старые фото" [ref=e940]
                    - heading "Эрмитаж пенсионерам и студентам" [level=3] [ref=e941]
                    - paragraph [ref=e942]: Эрмитаж сейчас готовит новую систему финансирования, по которой останутся все льготы, определенные законом — Герои Советского Союза, Герои Российской Федерации и полные кавалеры ордена Славы, независимо от гражданства имеют право на внеочередное посещение музея по бесплатному билету.
                    - paragraph [ref=e943]: Также с 1 августа 2020 года каждый третий четверг месяца музей смогут посетить по бесплатным билетам лица, не достигшие возраста 18 лет; лица, обучающиеся по основным профессиональным образовательным программам — студенты (курсанты), осваивающие образовательные программы среднего профессионального образования, программы бакалавриата, программы специалитета или программы магистратуры; многодетные семьи.
                    - paragraph [ref=e944]: Директор Эрмитажа сравнил новые правила с советской системой, в которой ни детям, ни пенсионерам бесплатного доступа в музей не предоставляли.
                    - paragraph [ref=e945]:
                      - 'img "Государственный Эрмитаж в Facebook. фотография: желатиновый отпечаток." [ref=e946]'
                    - heading "Маршруты Эрмитажа" [level=2] [ref=e947]
                    - paragraph [ref=e948]: Сегодня Эрмитаж предлагает несколько видов маршрутов по музею. Также есть возможность спланировать собственный маршрут. Для постоянного хранения маршрута или персональной коллекции вы должны войти в свою учётную запись пользователя.
                    - paragraph [ref=e949]: Если вы не зарегистрированы, вы можете зарегистрироваться, нажав кнопку "Войти" и создать аккаунт на странице входа в учётную запись. Если вы желаете лишь временно сохранить изменения маршрута или персональной коллекции, вы можете продолжить без входа в учётную запись.
                    - heading "Посетителям с ограниченной подвижностью" [level=3] [ref=e950]
                    - paragraph [ref=e951]: Государственный Эрмитаж вводит временные правила приема посетителей этой группы – для визита в музей нужно будет приобрести онлайн билеты только на определенные сеансы и маршруты. Эти меры позволят распределить потоки людей и обеспечить санитарно-эпидемиологическую безопасность, как для посетителей, так и для сотрудников музея. В настоящий момент схема посещения музея лицами с ограниченной подвижностью прорабатывается.
                    - paragraph [ref=e952]:
                      - img "“Галерея истории древней живописи в здании Нового Эрмитажа 1880-1890-е гг." [ref=e953]
                    - heading "Семейный маршрут" [level=3] [ref=e954]
                    - paragraph [ref=e955]: Маршрут предлагает юным гостям и их родителям знакомство с увлекательным миром музея. Он начинается на Парадной лестнице Зимнего дворца, построенного архитектором Ф. Б. Растрелли в 1754-1762 годах. Поднявшись по роскошной лестнице, украшенной золочёным орнаментом, статуями, плафоном на потолке и отражающейся в больших зеркалах, вы пройдёте по парадным залам императорской резиденции.
                    - paragraph [ref=e956]: В оформлении Фельдмаршальского, Петровского (Малого Тронного), Гербового, Георгиевского (Большого тронного) залов и Военной галереи 1812 года ясно звучит тема военной славы и могущества Российской империи.
                    - paragraph [ref=e957]: Затем, прогулявшись вдоль знаменитого Висячего сада, в нарядном Павильонном зале Малого Эрмитажа вы увидите мозаичные панно из смальты или цветного камня и фонтаны, часы Павлин (мастер Дж.Кокс, середина XVIII века, Великобритания) с двигающимися под музыку механическими фигурами птиц.
                    - paragraph [ref=e958]: В здании Старого (Большого) Эрмитажа (Ю. М.Фельтен, 1771-1787) расположена экспозиция искусства Италии эпохи Возрождения. Яркий красочный рельеф Джованни делла Роббиа "Рождество" представляет сцены евангельского рассказа о рождении Иисуса Христа. В самом большом и красивом зале этого здания находятся произведения великого мастера эпохи Возрождения Леонардо да Винчи.
                    - paragraph [ref=e959]: В одной из них - картине "Мадонна Бенуа" художник показал мадонну в образе юной итальянки, играющей со своим сыном. Затем вы перейдете в залы Нового Эрмитажа - здания императорского музея (Лео фон Кленце, 1752).
                    - paragraph [ref=e960]: В Лоджиях Рафаэля, которые повторяют лоджии в Ватикане, расписанные согласно замыслу Рафаэля его учениками, вы увидите персонажей античной мифологии и библейской истории, представителей флоры и фауны Земли, а также удивительные орнаменты-гротески.
                    - paragraph [ref=e961]: Самые большие залы – Просветы, где представлены произведения живописи Италии и Испании XVII – XVIII веков, украшены великолепными вазами и столами из лазурита и малахита, а также каменными светильниками.
                    - paragraph [ref=e962]: В огромной картине "Триумф императора" показано торжественное возвращение из похода одного из победоносных полководцев Древнего Рима. Выйдя на площадку Парадной лестницы Нового Эрмитажа, вы прочитаете надпись на мемориальной табличке над входом в Картинную галерею музея, и узнаете, кто стал создателем публичного музея.
                    - paragraph [ref=e963]: Спустившись на первый этаж, вы увидите из окна вестибюля знаменитый портик с атлантами. Среди экспонатов залов античного искусства обратите внимание на Венеру Таврическую, привезенную в Петербург при Петре I, и статую Юпитера – самую большую статую в музее. Маршрут заканчивается в зале искусства Древнего Египта, который неизменно пользуется популярностью среди гостей музея.
                    - paragraph [ref=e964]:
                      - img "Эрмитаж внутри. Старые фото" [ref=e965]
                    - heading "Обзорный маршрут по Эрмитажу. 1 час" [level=3] [ref=e966]
                    - paragraph [ref=e967]: Маршрут предлагает знакомство с парадными залами Зимнего дворца и всемирно известными шедеврами Эрмитажа. Он начинается у подножия Парадной лестницы Зимнего дворца. Барочный облик лестницы был воссоздан архитектором В. П. Стасовым после пожара 1837 года, в огне которого погибли все интерьеры дворца, построенного архитектором Ф.Б. Растрелли в 1754-1762 годах.
                    - paragraph [ref=e968]: "Вы познакомитесь с парадными залами официальной резиденции российских императоров: Фельдмаршальским, Петровским (Малым Тронным) залом, Гербовым залом, Военной галерей 1812 года и Георгиевским (Большим тронным залом), оформленными архитекторами XIX века."
                    - paragraph [ref=e969]: Пройдя вдоль Висячего сада по одной из двух галерей Малого Эрмитажа (Ю. М. Фельтен, Ж.-Б. Валлен-Деламот, 1764-1775), вы попадёте в нарядный Павильонный зал, где выставлены знаменитые часы "Павлин". В здании Старого (Большого) Эрмитажа (Ю. М. Фельтен, 1771-1787) расположена экспозиция искусства Италии эпохи Возрождения, включающая картины Джорджоне, Тициана и Леонардо да Винчи.
                    - paragraph [ref=e970]: Затем в залах Нового Эрмитажа - здания императорского музея (Лео фон Кленце, 1752), вы продолжите знакомство с коллекцией итальянского искусства, в составе которой произведения Рафаэля, Микеланджело, Караваджо. Один из трёх залов - Просветов посвящен испанской живописи.
                    - paragraph [ref=e971]: Эрмитаж обладает прекрасной коллекцией произведений голландских художников XVII века (Шатровый зал), гордостью которой являются картины Рембрандта. Затем вы выйдите в Галерею истории древней живописи и на верхнюю площадку Парадной лестницы Нового Эрмитажа. Достойны внимания расположенные здесь коллекции европейской скульптуры и великолепных ваз работы русских мастеров-камнерезов.
                    - paragraph [ref=e972]: Спустившись на I этаж, вы окажетесь в вестибюле, где увидите из окна знаменитый портик с атлантами. Среди экспонатов залов античного искусства обратите внимание на статую Венеры Таврической, бюст Филиппа Араба из прекрасной коллекции римского портрета и самую большую скульптуру в музее - изображение Юпитера, восседающего на троне. Маршрут заканчивается в зале искусства Древнего Египта, который неизменно пользуется популярностью среди гостей музея.
                    - paragraph [ref=e973]:
                      - img "Эрмитаж. Старые фото" [ref=e974]
                    - heading "Обзорный маршрут по Эрмитажу. 2 часа" [level=3] [ref=e975]
                    - paragraph [ref=e976]: Маршрут знакомит с основными экспозициями Эрмитажа, расположенными в четырех зданиях музейного комплекса. Он начинается на Парадной лестнице Зимнего дворца. Барочный облик лестницы был воссоздан архитектором В. П. Стасовым после пожара 1837 года, в огне которого погибли все интерьеры дворца, построенного архитектором Ф.Б. Растрелли в 1754-1762 годах.
                    - paragraph [ref=e977]: "Вы пройдёте по парадным залам официальной резиденции российских императоров: Фельдмаршальскому, Петровскому (Малому Тронному), Гербовому залу, Военной галерее 1812 года и Георгиевскому (Большому тронному) залу."
                    - paragraph [ref=e978]: В Александровском зале представлена великолепная коллекция западноевропейского серебра. Затем вы увидите шедевры всемирно известной Картинной галереи Эрмитажа, в которой представлены произведения мастеров всех крупных стран Европы. Картины Лоррена и Пуссена входят в огромное собрание французского искусства в Эрмитаже.
                    - paragraph [ref=e979]: Затем, в залах Нового Эрмитажа - здания императорского музея (Лео фон Кленце, 1752), вы сможете ознакомиться с прекрасными коллекциями картин знаменитых фламандских живописцев Рубенса и Ван Дейка, а также великого голландского художника Рембрандта. Экспозиция Шатрового зала посвящена голландской живописи XVII века.
                    - paragraph [ref=e980]: Самые большие залы - Просветы представляют произведения живописи Италии и Испании XVII – XVIII веков. Особый интерес публики вызывает знаменитый Рыцарский зал. В здании Старого (Большого) Эрмитажа (Ю. М.Фельтен, 1771-1787) расположена экспозиция искусства Италии эпохи Возрождения, включающая картины Леонардо да Винчи, Тициана, Джорджоне.
                    - paragraph [ref=e981]: Пройдя по площадке Советской лестницы, вы попадёте в Малый Эрмитаж (Ю.М. Фельтен, Ж.-Б. Валлен-Деламот, 1764-1775), где в нарядном Павильонном зале выставлены знаменитые часы "Павлин". Спустившись на I этаж, вы осмотрите залы искусства Древнего мира – Двадцатиколонный зал с выставкой керамики, и зал.
                    - paragraph [ref=e982]: Здесь находится грандиозная Колыванская ваза работы русских камнерезов XIX века, а также зал Юпитера, в котором представлены произведения скульптуры Древнего Рима. Маршрут заканчивается в зале искусства Древнего Египта. Желаем приятного знакомства с Эрмитажем.
