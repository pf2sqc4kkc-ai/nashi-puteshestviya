                - generic [ref=e1133]:
                  - generic [ref=e1134]: Маргарита Мы купили полуторачасовую экскурсию по Петербургу с посещением Эрмитажа. Зашли спокойно, правда, сначала стояли на входе, потом в вестибюле, но зато группы обслуживают в гардеробе вне очереди, а там очереди – ещё поискать такие нужно, прямо как у на в Мавзолей. Да уж, что скажешь, Эрмитаж – велик и прекрасен. Давно тут не были, экспозиции меняются, много нового. И это осмотреть все за один день невозможно. Поэтому планируем еще экскурсию, и не одну.
                  - generic [ref=e1135]: "Зинаида и Ко Были 4 января 2018, пришли в 9:15. Очередь была уже от ворот до столба. Зашли в Эрмитаж только в 10:20. Внутри уже были люди, это же культурное достояние России. Вход цена: взрослый-700 рублей, дети и студенты – бесплатно, что я считаю добавляет плюс Эрмитажу. Во избежание стояния в очереди, лучше купить билет в терминале на входе слева. В первый четверг каждого месяца в бесплатный день. Но народу - тучи, не протолкнуться."
                  - generic [ref=e1136]: Анатолий Иванович Некоторые даже петербуржцы не знают, что в Эрмитаже есть корпус современного искусства. Кстати, в нём не бывает много людей. Там можно увидеть "Черный квадрат" Казимира Малевича, копию "Короны Российской Империи" Карла Фаберже. Конечно, в любом здании Эрмитажа - шик, блеск, красота ! Не думаю, что еще где-то в мире можно увидеть подобную роскошь. Ожидание в очереди и цена билета стоит того!! А школьникам и студентам, вообще, бесплатный билет в кассе выдают. Взрослому из России по документу можно пройти по стоимости билета 400 руб. Обязательно нужно брать с собой перекус, однозначно проголодаетесь, особенно, если с детьми.
                  - generic [ref=e1137]: Нина Павлова Заказали заранее билеты через интернет-магазин Эрмитажа, распечатали и приехали за 15 минут до открытия, вошли быстро со стороны Миллионной улицы. Ходили поначалу около часа по безлюдным залам. Заплатили за билеты для взрослых каждый вход цена - 450 рублей, с нами был школьник, так - бесплатно. Один билет позволяет посетить Зимний Дворец, Дом Петра Первого и Новый Эрмитаж, который расположен в правом крыле здания Штаба на Дворцовой площади напротив Зимнего дворца.
                  - generic [ref=e1138]: Эвелина Роскошный Эрмитаж не может не покорить сердце. В который раз по нему бродим, восторгов нет предела. Но очереди вышибают из колеи. Нужно приходить хотя бы за пол часа до открытия. Мы были в начале января и пришли почти к открытию, так людей – море. Чтобы время не терять даром, погуглите заранее, что именно интересно посмотреть в Эрмитаже, сразу ищите соответствующие залы. Иначе бесцельно побродите, как мой братуха, который так и не нашёл свою Мону Лизу:)
                  - generic [ref=e1139]: Коля из Перми В Эрмитаже более 3-х миллионов экспонатов, около 300 шикарных залов. Если готовы отстоять в очереди не меньше 1 часа, то посетите этот Петербургский «Лувр». Будет масса лучших впечатлений и фотографий.
                  - generic [ref=e1140]: Зинаида Давно мечтала сходить в Эрмитаж. Входной билет купила в кассе в день посещения за 700 рублей, и узнала, что можно сделать заранее онлайн заказ по Интернету, тогда выйдет немного дешевле – 680 руб. Побывать в Зимнем дворце можно за 300 руб., или Дворец Меншикова, а за 550 рублей – центр реставрации Старая деревня. А в первый четверг каждого месяца в Эрмитаж ходят бесплатно школьники, студенты, пенсионеры.
                  - generic [ref=e1141]: Иванниковы Знали, что летом в Питере туристов со всего света тучи, самый туристический сезон, все говорили, но хотелось ночи белые увидеть, а то были зимой в прошлый раз. Эрмитаж недосмотрели тогда. Да мы поняли, что раз его посетишь, будет тянуть всю жизнь. Как посоветовали билеты покупали по электронке, потом очередь в 3 раза меньше обычной. Простояли около 40 минут вместо 3х часов. У входа в ворота стоят терминалы, оплачивали визой, билет взрослый 700 руб, детского нет, и по 5000 купюры не принимают. Все понравилось и даже нашему 5-летнему Егорке, стойко выдержал все Потом на современное искусство пошли, импрессионистов смотрели, впечатлило. Кстати, в Главный Штаб очереди в разы меньше.
                  - generic [ref=e1142]: Марина Эрмитаж посещали всей семьей, так как не каждый год выпадет такая возможность. за троих взрослых заплатила всего 1800 рублей, так как пенсионерам вход бесплатный. но это полный билет. по нему можно посетить Главный музейный комплекс, Главный Штаб, Зимний дворец Петра I, Дворец Меншикова, Музей Императорского фарфорового завода. Выбрали день посещения среду, чтобы дольше посмотреть экспонаты. Также до 21:00 музей работает и в пятницу. А по понедельникам он вовсе закрыт. Билеты покупали в кассе, в очереди стояли около 20 минут. Нужно обязательно взять с собой документы подтверждающие личность. У нас было 2 паспорта и водительские права. За 5 часов экскурсии мы смогли посетить около 40 залов и остались довольны.
                  - generic [ref=e1143]: Алиса Свершилась моя поездка в Петербург. Первым делом вы отправились с мужем в Эрмитаж. Я слышала про длинные очереди, поэтому мы купили электронные билеты. За двоих заплатили 1400 рублей. Думала что зайдем свободно, а оказалось этот билет надо обменять в кассе ив стать в отдельную очередь, где стоят обладатели электронных билетов. Мы меняли в кассе, которая расположена напротив колонны на дворцовой площади. И еще, мы купили воду в пластиковой бутылке, так от нее попросили избавиться. Более подробный список запрещенных вещей можно узнать на официальном сайте. Мы осматривали экспозицию самостоятельно. Больше всего понравился Павильонный зал.
