        - generic [ref=e193]:
          - heading "Интересные факты о Петергофе" [level=3] [ref=e194]
          - generic [ref=e196]:
            - generic [ref=e197]:
              - list:
                - listitem [ref=e198]:
                  - generic [ref=e199]: Максимальная высота струи фонтана Самсон – 21 метр
                - listitem [ref=e200]:
                  - generic [ref=e201]: Водоподводящая система Петергофа - это 96 километров каналов, 16 прудов, 135 различных гидросооружений
                - listitem [ref=e202]:
                  - generic [ref=e203]: Мастера фонтанного дела обслуживают 12 440 каменных поверхностей, ежедневно крутят около 300 задвижек, 60% которых XVIII-XIX веков
                - listitem [ref=e204]:
                  - generic [ref=e205]: "Первая картинная галерея в России появилась во дворце Монплезир: коллекция картин Петра I включала работы голландских, фламандских, итальянских и немецких художников XVII-XVIII вв"
                - listitem [ref=e206]:
                  - generic [ref=e207]: Фонтан Нептун старше Петергофа на 50 лет (был создан в 1650 - 1660 гг.)
                - listitem [ref=e208]:
                  - generic [ref=e209]: Аудиенц-зал - это первое помещение в России, в интерьере которого использовалась оптическая иллюзия (параллельные зеркала)
                - listitem [ref=e210]:
                  - generic [ref=e211]: Для подачи воды в фонтаны Петергофа никогда не использовались насосы. Вода прибывает естественным путем с Ропшинских высот по системе каналов, прудов и шлюзов
                - listitem [ref=e212]:
                  - generic [ref=e213]: "Первый в России Эрмитаж появился в Петергофе: он был построен по указу Петра I в Нижнем парке в 1721-1725 гг."
                - listitem [ref=e214]:
                  - generic [ref=e215]: Общий расход воды петергофскими фонтанами – 1100 литров в секунду
                - listitem [ref=e216]:
                  - generic [ref=e217]: Максимальная высота струи фонтана Самсон – 21 метр
                - listitem [ref=e218]:
                  - generic [ref=e219]: Водоподводящая система Петергофа - это 96 километров каналов, 16 прудов, 135 различных гидросооружений
