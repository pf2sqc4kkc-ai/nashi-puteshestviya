      - generic [ref=e126]:
        - generic [ref=e127]: Виртуальный тур
        - heading "Совершите прогулку по экспозиции Музея Фаберже" [level=2] [ref=e128]
        - generic [ref=e129]:
          - paragraph [ref=e130]: Музей располагается в Шуваловском дворце на набережной реки Фонтанки – одном из красивейших дворцов Санкт-Петербурга, который является историческим памятником и центром притяжения туристов.
          - paragraph [ref=e131]: "Исключительность коллекции Фаберже, собранной фондом «Связь времен», в том, что в ней достойно представлены все направления, в которых работала фирма Фаберже: пасхальные шедевры, фантазийные предметы всех разновидностей, ювелирные украшения, драгоценная галантерея, столовое серебро, интерьерные и культовые предметы."
          - paragraph [ref=e132]: Увидеть роскошные интерьеры Шуваловского дворца и уникальные шедевры основной экспозиции Музея Фаберже возможно не выходя из дома или офиса.
        - link "Виртуальный тур" [ref=e133] [cursor=pointer]:
          - /url: http://fabergemuseum.ru/3dtour/
