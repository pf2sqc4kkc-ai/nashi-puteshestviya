            - heading "Широкий выбор подарков, реплик коллекции и книг об эпохе Карла Фаберже, ювелирном искусстве и истории Санкт-Петербурга" [level=2] [ref=e115]:
              - text: Широкий выбор подарков, реплик коллекции
              - text: и книг об эпохе Карла Фаберже, ювелирном искусстве
              - text: и истории Санкт-Петербурга
            - paragraph [ref=e117]: В Магазине Музея представлены оригинальные сувениры, произведения русских дизайнеров, реплики музейной экспозиции, которые будут напоминать о посещении Музея Фаберже.
            - link "В магазин" [ref=e118] [cursor=pointer]:
