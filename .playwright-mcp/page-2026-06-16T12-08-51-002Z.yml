              - text: Оригинальные ювелирные украшения,
              - text: созданные современными авторами по мотивам
              - text: коллекции Музея Фаберже
            - paragraph [ref=e123]: В Магазине Музея Фаберже также можно приобрести эксклюзивные украшения и аксессуары, которые создали известные, современные российские ювелиры по мотивам главных произведений мастеров фирмы Карла Фаберже.
            - link "В магазин" [ref=e124] [cursor=pointer]:
