              - generic [ref=e80]:
                - link "Выставка братьев Маковских в Музее Фаберже" [ref=e81] [cursor=pointer]:
                  - /url: news/novosti/kopiya-programma-v-chest-180-letiya-karla-faberzhe
                - paragraph [ref=e83]: С 3 июня по 13 сентября в Музее Фаберже пройдет масштабная выставка «Константин и Владимир Маковские. Любовь земная и небесная», организованная Культурно-исторический фонд «Связь времен» и Музей Фаберже при поддержке своего многолетнего партнёра — ПАО «Газпром». Проект посвящен художественному наследию двух братьев из знаменитой творческой династии и приурочен к 180-летию Владимира Маковского.
                - link "Подробнее" [ref=e84] [cursor=pointer]:
                  - /url: news/novosti/kopiya-programma-v-chest-180-letiya-karla-faberzhe
            - generic [ref=e85]:
              - link [ref=e86] [cursor=pointer]:
                - /url: news/novosti/programmy-dlya-detey-v-iyune
              - generic [ref=e87]:
                - link "Программы для детей в июне" [ref=e88] [cursor=pointer]:
                  - /url: news/novosti/programmy-dlya-detey-v-iyune
                - paragraph [ref=e90]: "Каждые выходные в июне в Музее Фаберже будут проходить тематические программы для детей и их родителей: «Сказка в Музее Фаберже» (5-6 лет), «Драгоценный зоопарк» (6-8 лет), «История пасхального яйца» (7-10 лет) и другие."
                - link "Подробнее" [ref=e91] [cursor=pointer]:
                  - /url: news/novosti/programmy-dlya-detey-v-iyune
      - generic [ref=e93]:
        - generic [ref=e94]: О Музее Фаберже
        - heading "Основу собрания музея составляет крупнейшая коллекция шедевров фирмы Карла Фаберже" [level=2] [ref=e95]:
          - text: Основу собрания музея
          - text: составляет крупнейшая коллекция шедевров фирмы Карла Фаберже
        - generic [ref=e96]:
          - paragraph [ref=e97]: Наибольшую ценность представляют девять пасхальных яиц, созданных мастерами фирмы Карла Фаберже для двух последних русских императоров. Все они являются шедеврами ювелирного искусства и уникальными историческими памятниками, связанными с правлением и личной жизнью императоров Александра III и Николая II.
          - paragraph [ref=e98]: "На сегодняшний день собрание Музея Фаберже насчитывает более 4000 экспонатов, в котором также представлены другие направления, в которых работала фирма Фаберже: фантазийные предметы, ювелирные украшения, столовое серебро, интерьерные и культовые предметы."
        - link "Шедевры коллекции" [ref=e99] [cursor=pointer]:
          - /url: https://fabergemuseum.ru/kollekczii/shedevryi-kollekczii/
