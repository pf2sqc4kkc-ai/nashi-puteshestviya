                                    - generic [ref=e1252]: Зимний дворец (главное здание музейного комплекса) - моё любимое место в Санкт-Петербурге, в котором для меня останавливается время, недаром Эрмитаж входит в 20-ку лучших музеев мира! Все время открываешь что-то новое для себя. Можно бесконечно любоваться экспонатами разных эпох, полотнами знаменитых художников, скульптурами, интерьером. Помимо постоянной экспозиции проводятся временные выставки, тематические экскурсии, образовательные программы. В музее доступен в аренду аудиогид. Каждый третий четверг месяца Эрмитаж предоставляет бесплатное посещение гражданам льготных категорий, билеты выдаются в кассах музея со стороны церковной лестницы. На билете стоит цена 0 рублей 00 копеек). Добраться до музея можно на метро, ближайшая станция "Адмиралтейская", также рядом с Эрмитажем есть остановка "Дворцовая площадь", где останавливаются автобусы 7, 10, 24, 191 и троллейбусы 1, 7, 10, 11.
