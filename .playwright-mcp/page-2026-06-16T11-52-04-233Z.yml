                                    - generic [ref=e1499]: "«Сердце Ленинграда на Большой Конюшенной» Искать это место не нужно — его видно издалека по очереди. Да-да, той самой, ради которой мерзнешь на улице, но ни разу не жалеешь. Легендарная пышечная в доме 25 на Большой Конюшенной (бывшая улица Желябова) — это не просто столовка, а настоящий портал в прошлое, работающий с 1958 года . Внутри тебя встречают круглые столики, стены в полоску и советские плакаты. Потолок «состаренный», люстра антуражная — всё дышит ностальгией. Что почём (2026 гг.) Меню — это даже не меню, а константа. Здесь есть только пышки -30 рублей за штуку и напитки: кофе со сгущенкой, чай, лимонад . Считать тут легко: 3-4 пышки + кофе = около 150 рублей. В центре Питера это просто даром! Вкус Это не пончики из «Данкин Донатс». Это Ленинградская пышка. Она воздушная, с хрустящей корочкой, густо посыпанная пудрой с крахмалом, чтобы таяла во рту . Да, она жирненькая (жарят во фритюре, куда же без этого), но это тот случай, когда жирно — значит «очень вкусно» . Пока ешь горячую — это божественно. Минусы, которые становятся плюсами · Очереди: да, они есть всегда. Но движутся очень быстро, потому что кассиры работают как швейцарские часы . · Тесно: место популярное, так что столик придется «занять» стратегически. Совет от местных Берите навынос (дадут в крафтовый пакет) и идите есть их на улицу, запивая тем же кофе из термоса. А если невмоготу ждать, берите хотя бы штук 6 — на утро они всё равно будут мягкими после микроволновки . Вердикт Пышечная на Конюшенной — это не про изысканный обед. Это про эмоции, память и тот самый вкус детства, который не меняется десятилетиями. Даже если вы не фанат жареного теста, сюда нужно зайти ради атмосферы старого Ленинграда. Однозначно рекомендую"
