              - text: документ, выданный уполномоченным органом, подтверждающий факт участия заявителя в СВО, - для участника СВО;
              - text: справка военной части или военного комиссариата - для членов семьи участника СВО;
              - text: студенческий билет или справка образовательного учреждения, подтверждающая обучение ребенка (детей) участника СВО в образовательном учреждении всех типов и видов по очной форме обучения, - для детей участника СВО в возрасте от 18 до 23 лет (включительно);
              - text: справка, подтверждающая факт установления инвалидности - для детей участника СВО, являющихся инвалидами, независимо от возраста.
              - text: "При отсутствии справки военной части или военного комиссариата, выданной для членов семьи участников СВО, членами семьи участника СВО предъявляются следующие документы:"
              - text: документ, выданный уполномоченным органом, подтверждающий факт участия супруга (супруги), либо родителя (усыновителя), либо ребенка, в том числе усыновленного, либо отчима (мачехи) в СВО, в том числе справка военной части или военного комиссариата;
              - text: свидетельство о заключении брака - для супруга (супруги) участника СВО;
