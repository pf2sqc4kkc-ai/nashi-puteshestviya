    - generic [ref=e64]:
      - paragraph [ref=e65]: В условиях действия ограничительных мер в связи с распространением новой коронавирусной инфекции (COVID-19) мы следуем рекомендациям Роспотребнадзора, направленным на безопасность сотрудников и гостей нашего музея.
      - paragraph [ref=e66]: "В соответствии с Постановлением Правительства Санкт-Петербурга от 13.03.2020 N 121:"
      - paragraph [ref=e67]:
        - strong [ref=e68]: Ваша безопасность
      - list [ref=e69]:
        - listitem [ref=e70]: Ношение средств индивидуальной защиты органов дыхания (маски) носит рекомендательный характер с 27.05.2022.
        - listitem [ref=e71]: Следовать обозначенному однонаправленному маршруту осмотра, придерживаясь рекомендаций специалистов музея.
        - listitem [ref=e72]: На входе в музей установлены специальные аппараты с дезинфицирующим средством для рук.
        - listitem [ref=e73]: В местах взаимодействия с посетителями установлены защитные экраны.
        - listitem [ref=e74]: В музее проводится регулярная влажная уборка помещений с использованием дезинфицирующих средств.
        - listitem [ref=e75]: Осуществляется обработка всех контактных поверхностей на территории музея.
        - listitem [ref=e76]: Аудиогиды проходят дезинфекцию после каждого использования.
        - listitem [ref=e77]:
